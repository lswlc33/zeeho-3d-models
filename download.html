<script id="download-controller">
(function () {
  'use strict';
  // 安装包只采用原有官方/镜像地址，不读取账号、不接受 URL 参数，不调用极核 API。
  // GitHub 系线路共用 raw 地址，镜像仅加前缀；CF 线是独立域名不走镜像。
  var GH_APK = 'https://raw.githubusercontent.com/lswlc33/zeeho-3d-models/main/app/zeehowebnext.apk';
  var GH_SRC = 'https://lswlc33.github.io/zeeho-3d-models/app/version2.json';
  var apkSources = {
    cf: { label: 'Cloudflare 线路', url: 'https://zhb.xn--fiqz59cpva341l.top/app/zeehowebnext.apk' },
    github: { label: 'GitHub 官方', url: GH_APK },
    ghfast: { label: 'ghfast 镜像', url: 'https://ghfast.top/' + GH_APK },
    ghproxy: { label: 'gh-proxy 镜像', url: 'https://gh-proxy.com/' + GH_APK },
    jsdelivr: { label: 'jsDelivr 镜像', url: 'https://cdn.jsdelivr.net/gh/lswlc33/zeeho-3d-models@main/app/zeehowebnext.apk' }
  };
  var sourceUrls = {
    cf: { label: 'Cloudflare 线路', url: 'https://zhb.xn--fiqz59cpva341l.top/app/version2.json', ipa: 'https://zhb.xn--fiqz59cpva341l.top/app/zeehowebnext.ipa' },
    github: { label: 'GitHub 官方', url: GH_SRC, ipa: 'https://lswlc33.github.io/zeeho-3d-models/app/zeehowebnext.ipa' },
    ghfast: { label: 'ghfast 镜像', url: 'https://ghfast.top/' + GH_SRC, ipa: 'https://ghfast.top/https://lswlc33.github.io/zeeho-3d-models/app/zeehowebnext.ipa' },
    ghproxy: { label: 'gh-proxy 镜像', url: 'https://gh-proxy.com/' + GH_SRC, ipa: 'https://gh-proxy.com/https://lswlc33.github.io/zeeho-3d-models/app/zeehowebnext.ipa' },
    jsdelivr: { label: 'jsDelivr 镜像', url: 'https://cdn.jsdelivr.net/gh/lswlc33/zeeho-3d-models@main/app/version2.json', ipa: 'https://cdn.jsdelivr.net/gh/lswlc33/zeeho-3d-models@main/app/zeehowebnext.ipa' }
  };
  var signers = {
    altstore:     { name: 'AltStore',      build: function (u) { return 'altstore://source?url=' + encodeURIComponent(u); } },
    sidestore:    { name: 'SideStore',     build: function (u) { return 'sidestore://source?url=' + encodeURIComponent(u); } },
    feather:      { name: 'Feather',       build: function (u) { return 'feather://source/' + u; } },
    nsk:          { name: '全能签',         build: function (u) { return 'nsk-sign://addsource?url=' + encodeURIComponent(u); } },
    livecontainer:{ name: 'LiveContainer', build: function (u) { return 'livecontainer://sources?url=' + encodeURIComponent(u); } },
    lcsign:       { name: 'lcsign',        build: function (u) { return 'loadcontroller://addsource?url=' + encodeURIComponent(u); } }
  };
  var key = 'cf', storageKey = 'zeeho.downloadSource';
  var iosLine = 'cf', iosLineStorageKey = 'zeeho.downloadSourceIos';
  var link = document.getElementById('download-app');
  var copy = document.getElementById('copy-link');
  var picker = document.getElementById('choose-source');
  var sourceDialog = document.getElementById('source-dialog');
  var signerDialog = document.getElementById('signer-dialog');
  var iosLineDialog = document.getElementById('ios-line-dialog');
  try {
    var saved = localStorage.getItem(storageKey);
    if (Object.prototype.hasOwnProperty.call(apkSources, saved)) key = saved;
    var savedIosLine = localStorage.getItem(iosLineStorageKey);
    if (Object.prototype.hasOwnProperty.call(sourceUrls, savedIosLine)) iosLine = savedIosLine;
  } catch (e) { /* 存储受限仍能下载 */ }
  function paintApk() {
    link.href = apkSources[key].url;
    document.getElementById('source-name').textContent = apkSources[key].label;
  }
  function paintIosLine() {
    document.getElementById('ios-line-name').textContent = sourceUrls[iosLine].label;
  }
  function currentSourceUrl() { return sourceUrls[iosLine].url; }
  function currentIpaUrl() { return sourceUrls[iosLine].ipa; }
  function fallbackCopy(text, done) {
    var field = document.createElement('textarea');
    field.value = text;
    field.setAttribute('readonly', '');
    field.style.cssText = 'position:fixed;top:0;left:-9999px';
    document.body.appendChild(field);
    var ok = false;
    try { field.select(); ok = document.execCommand('copy'); } catch (e) { /* 失败不伪报成功 */ }
    document.body.removeChild(field);
    done(ok);
  }
  function copyText(text, done) {
    if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
      try {
        navigator.clipboard.writeText(text).then(function () { done(true); }, function () { fallbackCopy(text, done); });
      } catch (e) { fallbackCopy(text, done); }
    } else fallbackCopy(text, done);
  }
  paintApk();
  paintIosLine();
  // iOS Safari 在 showModal 后自动聚焦首个选项，把页面滚出视口并画出聚焦框；
  // 打开后立即把焦点移回 dialog 本身（不滚动），关闭时再清掉焦点
  function calmDialogFocus(dialog) {
    try { dialog.focus({ preventScroll: true }); } catch (e) { dialog.focus(); }
  }
  function blurDialogFocus(dialog) {
    if (document.activeElement && dialog.contains(document.activeElement)) document.activeElement.blur();
  }
  [['signer-dialog', signerDialog], ['source-dialog', sourceDialog], ['ios-line-dialog', iosLineDialog]].forEach(function (pair) {
    document.getElementById(pair[0]).addEventListener('close', function () { blurDialogFocus(pair[1]); });
  });
  picker.addEventListener('click', function () { sourceDialog.showModal(); calmDialogFocus(sourceDialog); });
  // 点击线路立即生效并收起；点空白处关闭
  sourceDialog.addEventListener('click', function (event) {
    if (event.target === sourceDialog) { sourceDialog.close(); return; }
    var item = event.target.closest ? event.target.closest('[data-apk-line]') : null;
    if (!item) return;
    var next = item.getAttribute('data-apk-line');
    if (!Object.prototype.hasOwnProperty.call(apkSources, next)) return;
    key = next;
    try { localStorage.setItem(storageKey, key); } catch (e) { /* 本次选择仍然生效 */ }
    paintApk();
    sourceDialog.close();
  });
  copy.addEventListener('click', function () {
    copy.disabled = true;
    copyText(apkSources[key].url, function (ok) { copy.disabled = false; });
  });
  document.getElementById('add-source').addEventListener('click', function () { signerDialog.showModal(); calmDialogFocus(signerDialog); });
  document.getElementById('copy-source').addEventListener('click', function () {
    copy.disabled = true;
    copyText(currentSourceUrl(), function (ok) { copy.disabled = false; });
  });
  document.getElementById('choose-ios-line').addEventListener('click', function () { iosLineDialog.showModal(); calmDialogFocus(iosLineDialog); });
  iosLineDialog.addEventListener('click', function (event) {
    if (event.target === iosLineDialog) { iosLineDialog.close(); return; }
    var item = event.target.closest ? event.target.closest('[data-ios-line]') : null;
    if (!item) return;
    var next = item.getAttribute('data-ios-line');
    if (!Object.prototype.hasOwnProperty.call(sourceUrls, next)) return;
    iosLine = next;
    try { localStorage.setItem(iosLineStorageKey, iosLine); } catch (e) { /* 本次选择仍然生效 */ }
    paintIosLine();
    iosLineDialog.close();
  });
  // 点选即用：点哪个工具就直接拼 scheme 打开，并收起弹窗；点空白处关闭
  signerDialog.addEventListener('click', function (event) {
    if (event.target === signerDialog) { signerDialog.close(); return; }
    var item = event.target.closest ? event.target.closest('[data-signer]') : null;
    if (!item) return;
    var signer = signers[item.getAttribute('data-signer')];
    if (!signer) return;
    signerDialog.close();
    location.href = signer.build(currentSourceUrl());
  });
  // 不经工具直接下载 IPA（跟随当前下载线路）
  document.getElementById('signer-download').addEventListener('click', function () {
    signerDialog.close();
    location.href = currentIpaUrl();
  });
})();
</script>
