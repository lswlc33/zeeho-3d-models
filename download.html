<style>:root{color-scheme:light;--md-sys-color-surface:#fef7ff;--md-sys-color-surface-container:#f3edf7;--md-sys-color-surface-container-lowest:#ffffff;--md-sys-color-surface-container-high:#ece6f0;--md-sys-color-on-surface:#1d1b20;--md-sys-color-on-surface-variant:#49454f;--md-sys-color-primary:#7457b8;--md-sys-color-on-primary:#ffffff;--md-sys-color-primary-container:#e7ddff;--md-sys-color-on-primary-container:#452d7a}@media (prefers-color-scheme:dark){:root{color-scheme:dark;--md-sys-color-surface:#141218;--md-sys-color-surface-container:#211f26;--md-sys-color-surface-container-lowest:#1d1b20;--md-sys-color-surface-container-high:#2b2930;--md-sys-color-on-surface:#e6e0e9;--md-sys-color-on-surface-variant:#cac4d0;--md-sys-color-primary:#cfbdf7;--md-sys-color-on-primary:#3a2a63;--md-sys-color-primary-container:#4b3a80;--md-sys-color-on-primary-container:#e7ddff}}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--md-sys-color-surface-container);color:var(--md-sys-color-on-surface);font:16px/1.65 system-ui,-apple-system,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}button,.button{border:0}button:focus-visible,a:focus-visible{outline:3px solid var(--md-sys-color-primary);outline-offset:4px}[hidden]{display:none !important}main{width:min(100%,600px);margin:0 auto;padding:calc(40px + env(safe-area-inset-top,0px)) 24px calc(28px + env(safe-area-inset-bottom,0px))}.brand{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:650}.brand img{width:40px;height:40px;border-radius:14px}.hero{padding:40px 0 28px}.badge{display:inline-flex;padding:5px 12px;border-radius:999px;background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container);font-size:12px;font-weight:650}h1{margin:14px 0 18px;font-size:clamp(32px,7vw,44px);font-weight:650;line-height:1.18;letter-spacing: -.025em}.hero p{margin:0;color:var(--md-sys-color-on-surface-variant)}.card{padding:24px;border-radius:28px;background:var(--md-sys-color-surface-container-lowest)}.app-info{display:flex;align-items:center;gap:16px}.app-icon{width:64px;height:64px;border-radius:20px;flex-shrink:0}.app-info h2{font-size:22px;margin:0;font-weight:650;line-height:1.4}.app-info p{margin:2px 0 0;font-size:13px;color:var(--md-sys-color-on-surface-variant)}.android{margin:20px 0;padding:12px 16px;border-radius:16px;background:var(--md-sys-color-surface-container-high);font-size:13px;color:var(--md-sys-color-on-surface-variant)}.actions{display:grid;grid-template-columns:1fr auto;gap:10px}.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:999px;font-size:14px;font-weight:650;text-decoration:none}.primary{background:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary)}.tonal{background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container)}.button svg,.source svg{width:20px;height:20px;fill:currentColor;flex-shrink:0}.source{width:100%;display:flex;align-items:center;gap:12px;min-height:48px;margin-top:14px;padding:10px 4px;background:none;color:var(--md-sys-color-on-surface-variant);font-size:13px;text-align:left}.source .source-name{flex:1;text-align:right;color:var(--md-sys-color-primary)}.status{margin:10px 0 0;min-height:24px;color:var(--md-sys-color-on-surface-variant);font-size:13px}footer{margin-top:28px;text-align:center;font-size:12px;color:var(--md-sys-color-on-surface-variant)}dialog{width:min(calc(100% - 32px),420px);max-height:calc(100% - 48px);margin:auto;padding:24px;border:0;border-radius:28px;background:var(--md-sys-color-surface-container-lowest);color:var(--md-sys-color-on-surface)}dialog::backdrop{background:rgb(0 0 0 / .4)}dialog h2{margin:0 0 16px;font-size:22px}.choices{display:flex;flex-direction:column;gap:8px}.choice{min-height:56px;display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:16px;background:var(--md-sys-color-surface-container-high);cursor:pointer}.choice:has(input:checked){background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container)}.choice input{width:20px;height:20px;margin:0;accent-color:var(--md-sys-color-primary)}.dialog-actions{display:flex;justify-content:flex-end;margin-top:16px}@media (max-width:360px){main{padding-left:16px;padding-right:16px}.card{padding:20px}.button{padding-left:18px;padding-right:18px}}</style>
</head>
<body>
<main>
  <header class="brand"><img src="icons/icon-192.png" alt="" width="40" height="40"><span>极核面板</span></header>
  <section class="hero" aria-labelledby="retirement-title">
    <span class="badge">网页已停用</span>
    <h1 id="retirement-title">在 App 中继续</h1>
    <p>因不可抗拒力，程序不再支持网页直接使用，软件正在构想 KMP</p>
  </section>
  <section class="card" aria-labelledby="app-title">
    <div class="app-info">
      <img class="app-icon" src="icons/icon-192.png" alt="几何面板图标" width="64" height="64">
      <div><h2 id="app-title">几何面板</h2><p>Android 客户端 · 仅安卓</p></div>
    </div>
    <p class="android">仅支持安卓安装，iOS 暂不提供可用版本。</p>
    <div class="actions">
      <a id="download-app" class="button primary" href="https://raw.githubusercontent.com/lswlc33/zeeho-3d-models/main/app/zeehowebnext.apk" rel="noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 3h2v10l3.5-3.5 1.4 1.4L12 16.8l-5.9-5.9 1.4-1.4L11 13V3ZM5 18h14v3H5v-3Z"/></svg>下载 App
      </a>
      <button id="copy-link" class="button tonal" type="button" hidden>复制链接</button>
    </div>
    <button id="choose-source" class="source" type="button" aria-haspopup="dialog" aria-controls="source-dialog" hidden>
      <span>下载线路</span><span id="source-name" class="source-name">GitHub官方</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7-1.4-1.4 5.6-5.6-5.6-5.6L9 5Z"/></svg>
    </button>
    <p id="download-status" class="status" role="status" aria-live="polite"></p>
  </section>
  <footer>本网站仅用于软件与资源分发</footer>
</main>
<dialog id="source-dialog" aria-labelledby="source-title">
  <h2 id="source-title">下载线路</h2>
  <div class="choices" role="radiogroup" aria-label="下载线路">
    <label class="choice"><input type="radio" name="download-source" value="github" checked><span>GitHub官方</span></label>
    <label class="choice"><input type="radio" name="download-source" value="ghfast"><span>ghfast镜像</span></label>
    <label class="choice"><input type="radio" name="download-source" value="ghproxy"><span>gh-proxy镜像</span></label>
    <label class="choice"><input type="radio" name="download-source" value="jsdelivr"><span>jsDelivr镜像</span></label>
  </div>
  <div class="dialog-actions"><button id="source-done" class="button tonal" type="button">完成</button></div>
</dialog>
<script id="download-controller">
(function () {
  'use strict';
  // 安装包只采用原有官方/镜像地址，不读取账号、不接受 URL 参数，不调用极核 API。
  var sources = {
    github: { label: 'GitHub官方', url: 'https://raw.githubusercontent.com/lswlc33/zeeho-3d-models/main/app/zeehowebnext.apk' },
    ghfast: { label: 'ghfast镜像', url: 'https://ghfast.top/https://raw.githubusercontent.com/lswlc33/zeeho-3d-models/main/app/zeehowebnext.apk' },
    ghproxy: { label: 'gh-proxy镜像', url: 'https://gh-proxy.com/https://raw.githubusercontent.com/lswlc33/zeeho-3d-models/main/app/zeehowebnext.apk' },
    jsdelivr: { label: 'jsDelivr镜像', url: 'https://cdn.jsdelivr.net/gh/lswlc33/zeeho-3d-models@main/app/zeehowebnext.apk' }
  };
  var key = 'github', storageKey = 'zeeho.downloadSource';
  var link = document.getElementById('download-app');
  var copy = document.getElementById('copy-link');
  var picker = document.getElementById('choose-source');
  var dialog = document.getElementById('source-dialog');
  var status = document.getElementById('download-status');
  try { var saved = localStorage.getItem(storageKey); if (Object.prototype.hasOwnProperty.call(sources, saved)) key = saved; } catch (e) { /* 存储受限仍能下载 */ }
  function paint() {
    link.href = sources[key].url;
    document.getElementById('source-name').textContent = sources[key].label;
    var options = dialog.querySelectorAll('input[name="download-source"]');
    for (var i = 0; i < options.length; i++) options[i].checked = options[i].value === key;
  }
  paint();
  copy.hidden = false;
  if (typeof dialog.showModal === 'function') picker.hidden = false;
  picker.addEventListener('click', function () { dialog.showModal(); });
  document.getElementById('source-done').addEventListener('click', function () { dialog.close(); });
  dialog.addEventListener('change', function (event) {
    var next = event.target.value;
    if (!Object.prototype.hasOwnProperty.call(sources, next)) return;
    key = next;
    try { localStorage.setItem(storageKey, key); } catch (e) { /* 本次选择仍然生效 */ }
    paint();
    status.textContent = '已选择' + sources[key].label;
    dialog.close();
  });
  link.addEventListener('click', function () { status.textContent = '正在打开下载链接，可在浏览器下载记录里查看'; });
  function fallbackCopy(text) {
    var field = document.createElement('textarea');
    field.value = text;
    field.setAttribute('readonly', '');
    field.style.cssText = 'position:fixed;top:0;left:-9999px';
    document.body.appendChild(field);
    var ok = false;
    try { field.select(); ok = document.execCommand('copy'); } catch (e) { /* 失败不伪报成功 */ }
    document.body.removeChild(field);
    status.textContent = ok ? '下载链接已复制' : '复制失败，请长按下载按钮复制链接';
    copy.disabled = false;
  }
  copy.addEventListener('click', function () {
    var text = sources[key].url;
    copy.disabled = true;
    if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
      try {
        navigator.clipboard.writeText(text).then(function () {
          status.textContent = '下载链接已复制'; copy.disabled = false;
        }, function () { fallbackCopy(text); });
      } catch (e) { fallbackCopy(text); }
    } else fallbackCopy(text);
  });
})();
</script>
</body>
