<!-- 缩放三处一起禁（双击 + 双指）：viewport 这三条是给安卓/其它认它的浏览器兜底；
     iOS Safari 从 iOS 10 起就忽略 user-scalable/maximum-scale（无障碍考虑），
     那边靠 CSS 的 touch-action: pan-x pan-y 和 app.js 里的 gesture*/两指 touchmove 拦截。 -->
<!-- 两个 theme-color：JS 没跑之前浏览器按系统偏好自己挑（跑起来后 applyTheme 会接管）。
     系统深浅色，Android 用上面那条 meta 给状态栏/地址栏着色。 -->
<meta name="theme-color" content="#fef7ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141218" media="(prefers-color-scheme: dark)">

<!-- 构建号：build-static.mjs 出包时把 content 里的占位符换成时间戳，同一份值另写一份进 version.json。
     独立 PWA 从后台恢复不会重新加载页面，app.js 拿它比对后自动整页重载（见 app.js 的 checkBuild）。
     占位符别写成 __BUILD__ 那类下划线串：页面里的 JS 也要整文件替换一遍，会把代码里的字面量一起改掉（踩过）。 -->

<title>极核仪表盘 · 网页版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23426b00'/%3E%3Cpath d='M18 5 9 18h5l-1.4 9L22 14h-5.2z' fill='%23c3f18c'/%3E%3C/svg%3E">
<script>
  // 首屏主题必须在样式之前定下来，否则深色手机上会先闪一下浅色底。
  // 与 app.js 用同一个 localStorage 键；没存过（或存的是老版本的值）就跟随系统。
  (function () {
    try {
      var t = JSON.parse(localStorage.getItem('zeeho.dash') || '{}').theme;
      var sys = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = (t === 'light' || t === 'dark') ? t : sys;
    } catch (e) { /* 保持 <html data-theme> 上的默认值 */ }
  })();
  // 独立 PWA：先把文档撑到屏幕高，iOS 才会给出完整视口（否则底部留一条黑边、顶上顶栏钻到状态栏底下）。
  // 放这里是为了赶在首屏绘制之前；app.js 起来后会写同一个值（那边是权威实现，见 fitViewport）。
  try {
    if ((navigator.standalone === true || matchMedia('(display-mode: standalone)').matches) && screen.height > window.innerHeight) {
      document.documentElement.style.minHeight = screen.height + 'px';
    }
  } catch (e) { /* 忽略 */ }
</script>

   极核仪表盘 · 样式
   ----------------------------------------------------------------------------
   设计令牌按 Material 3 语义槽位命名（--md-sys-*），数值取自 Material Web 的

  --map-filter: ;

  /* ---------- 浅色 ---------- */
  --md-sys-color-surface: #fef7ff;
  --md-sys-color-surface-dim: #ded8e1;
  --md-sys-color-surface-container-lowest: #ffffff;
  --md-sys-color-surface-container-low: #f7f2fa;
  --md-sys-color-surface-container: #f3edf7;
  --md-sys-color-surface-container-high: #ece6f0;
  --md-sys-color-surface-container-highest: #e6e0e9;
  --md-sys-color-on-surface: #1d1b20;
  --md-sys-color-on-surface-variant: #49454f;
  --md-sys-color-outline: #79747e;
  --md-sys-color-outline-variant: #cac4d0;
  --md-sys-color-inverse-surface: #322f35;
  --md-sys-color-inverse-on-surface: #f5eff7;
  --md-sys-color-scrim: #000;

  /* 品牌强调色：默认「极核绿」，由 data-accent 切换（见文件末三个主题块） */
  --md-sys-color-primary: #426b00;
  --md-sys-color-on-primary: #ffffff;
  --md-sys-color-primary-container: #c3f18c;
  --md-sys-color-on-primary-container: #2a4300;

  /* 状态色：M3 没有 success/warning 槽位，按行业惯例取值（见 MUI palette） */
  --c-success: #2e7d32;
  --c-success-container: #c8e6c9;
  --c-warning: #b26a00;
  --c-warning-container: #ffe0b2;
  --c-danger: #b3261e;
  --c-danger-container: #f9dedc;
  --c-info: #00629e;
  --c-info-container: #cde5ff;
  --c-charge: #0b7bc1;

  --glow: color-mix(in srgb, var(--md-sys-color-primary) 26%, transparent);
  --glow-soft: color-mix(in srgb, var(--md-sys-color-primary) 12%, transparent);
  --tint: color-mix(in srgb, var(--md-sys-color-primary) 8%, transparent);

  /* ---------- 形状 ---------- */
  --shape-xs: 4px;
  --shape-s: 8px;
  --shape-m: 12px;
  --shape-l: 16px;
  --shape-xl: 20px;
  --shape-2xl: 28px;
  --shape-full: 9999px;

  /* ---------- 阴影（M3 key + ambient 双层） ---------- */
  --el1: 0 1px 2px 0 rgba(0, 0, 0, .3), 0 1px 3px 1px rgba(0, 0, 0, .15);
  --el2: 0 1px 2px 0 rgba(0, 0, 0, .3), 0 2px 6px 2px rgba(0, 0, 0, .15);
  --el3: 0 1px 3px 0 rgba(0, 0, 0, .3), 0 4px 8px 3px rgba(0, 0, 0, .15);

  /* iOS 独立 PWA：视口会比屏幕矮掉状态栏那一条（WebKit bug 301108），**只要文档本身够高，
   iOS 就会把完整视口给出来**（frappe/frappe-ui #1289 的结论），固定壳才铺得到底边。
   这里只是兜底（app.js:fitViewport 会按 screen.height 写死一个更准的值，行内样式优先级更高）：
   用 `100% + 状态栏高度`——别写 min(100lvh, …)，实测那台 iOS 26 上 lvh 本身就低报，一卡等于没撑。
   （display-mode: standalone 只在"添加到主屏幕"后成立，浏览器里打开不受影响。） */

  html { min-height: calc(100% + env(safe-area-inset-top, 0px)); }

/* 注意：--sat/--sab 的最终值由 JS（app.js:fitViewport）按"页面哪条边顶到屏幕"分别写死，
   写在 <html> 的行内样式上；这里不再用 .edge 之类的选择器去覆盖，免得两套机制打架。
   JS 没跑起来时就用 :root 里的原始 env() 值。 */

/* ---------- 状态层 ---------- */
  --hover: .08;
  --pressed: .10;

  /* ---------- 动效 ---------- */
  --ease-standard: cubic-bezier(.2, 0, 0, 1);
  --ease-decel: cubic-bezier(.05, .7, .1, 1);
  --ease-accel: cubic-bezier(.3, 0, .8, .15);
  --dur-short: 150ms;
  --dur-med: 300ms;
  --dur-long: 500ms;

  /* ---------- 视口与安全区 ---------- */
  /* --sat/--sab：安全区。**独立 PWA 里全吃**（页面铺满整屏，不给就会出现"顶栏压到状态栏底下 /
     tab 标签被 home indicator 压住"）；浏览器标签页里页面夹在地址栏和工具栏之间，
     再按 env() 留白就是双份，所以只在视口真的顶到屏幕边时才吃（app.js:fitViewport 判断）。
     另外 fitViewport 还要把文档撑到 screen.height——iOS 26 独立 PWA 不给完整视口，
     底部会留一条底色，就是那个"黑边"。 */
  /* 原始值留着给 JS 判断用（--sat/--sab 是"最终要不要吃"的值，可能被 JS 清零） */
  --sat-raw: env(safe-area-inset-top, 0px);
  --sab-raw: env(safe-area-inset-bottom, 0px);
  --sat: var(--sat-raw);
  --sab: var(--sab-raw);

  /* ---------- 版式基准 ---------- */
  /* 页面左右留白：滚动区与顶栏都用它，保证卡片边缘和车名/头像在同一条竖线上。
     改这一个值就能整体调宽窄，不要再去给单个模块加 padding。 */

  /* 区块之间的竖向间距：由 .page 的 gap 统一给（不要再用 .card + .card 那种相邻兄弟选择器，
     中间夹一个 div 就断链，卡片会直接贴在一起）。 */
  --gap: 12px;
  /* 顶栏高度：这里是兜底值，实际高度由 renderTop() 量完写回（车名换行、安全区都会改变它，
     写死会让内容被顶栏压住）。滚动区的上内边距 = 它 + 10px 间隙。 */
  --topbar-h: 72px;

  /* MiSans 放最前（index.html 里引了它的 Medium/Bold 两个 @font-face，族名就叫 MiSans）；
     后面的系统字体是离线/CDN 不通时的兜底。 */
  --font: MiSans, system-ui, -apple-system, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Segoe UI", sans-serif;
}

[data-theme="dark"] {
  color-scheme: dark;
  /* 高德栅格瓦片只有白天样式：invert 反相 + hue-rotate(180) 把色相转回来，得到"深色底、浅色字"的地图，
     再压一点亮度和饱和度，免得反相后太扎眼。只作用在 .tiles 上——
     图钉、轨迹线、标记是我们自己画的，反相会把它们的颜色也带跑。 */
  --map-filter: invert(1) hue-rotate(180deg) brightness(.88) contrast(.92) saturate(.7);

  --md-sys-color-surface: #141218;
  --md-sys-color-surface-dim: #141218;
  --md-sys-color-surface-container-lowest: #0f0d13;
  --md-sys-color-surface-container-low: #1d1b20;
  --md-sys-color-surface-container: #211f26;
  --md-sys-color-surface-container-high: #2b2930;
  --md-sys-color-surface-container-highest: #36343b;
  --md-sys-color-on-surface: #e6e0e9;
  --md-sys-color-on-surface-variant: #cac4d0;
  --md-sys-color-outline: #938f99;
  --md-sys-color-outline-variant: #49454f;
  --md-sys-color-inverse-surface: #e6e0e9;
  --md-sys-color-inverse-on-surface: #322f35;

  --c-success: #81c784;
  --c-success-container: #1f3d21;
  --c-warning: #ffb74d;
  --c-warning-container: #4a3200;
  --c-danger: #f2b8b5;
  --c-danger-container: #5c1813;
  --c-info: #7fc7ff;
  --c-info-container: #10405f;
  --c-charge: #7fc7ff;

  --md-sys-color-primary-container: #cde5ff;

  --md-sys-color-on-primary: #003353;
  --md-sys-color-primary-container: #004a72;
  --md-sys-color-on-primary-container: #cde5ff;
}
:root[data-accent="purple"] {
  --md-sys-color-primary: #6750a4;
  --md-sys-color-on-primary: #fff;
  --md-sys-color-primary-container: #eaddff;
  --md-sys-color-on-primary-container: #4f378b;

[data-theme="dark"][data-accent="purple"] {

  --md-sys-color-on-primary: #381e72;
  --md-sys-color-primary-container: #4f378b;
  --md-sys-color-on-primary-container: #eaddff;
}

/* ============================ 基础 ============================ */
* { box-sizing: border-box; }

/* 外层不做"文档滚动"：整个 App 是固定壳 + 内部滚动区，文档本身滚动只会带来问题
   （iOS 橡皮筋、键盘/scrollIntoView 把绝对定位的顶栏顶出视口）。 */
html, body { height: 100%; overflow: hidden; }

/* 根元素也铺主题底色：万一 iOS 还是少给了一条视口（撑高没生效、或撑高之前那一帧），
   露出来的是页面主色而不是白/黑——"黑边"最刺眼的就是浅色主题下露深色。
   （body 的底色会随之不再传播到画布，桌面预览那块深色展台仍由 body 自己的 background 负责。） */
html { background-color: var(--md-sys-color-surface); }

/* 整屏固定壳没有"放大看看"的余地：一缩放视口，壳就被裁掉一截、而且基本回不来（用户实测踩到）。
   pan-x pan-y = 只留单指拖动（内部滚动区还要用），双击放大和双指缩放都不给；别写 none，那连拖动都没了。
   按规范浏览器会把被摸元素与祖先的 touch-action 取交集，所以写在根上就覆盖全部子元素。
   iOS 上双指缩放另有一道 JS 拦截（见 app.js 的"手势"一节）——Safari 忽略 viewport 的 user-scalable=no。 */
html, body { touch-action: pan-x pan-y; }

body {
  margin: 0;
  font-family: var(--font);
  font-size: 14px;
  line-height: 20px;
  color: var(--md-sys-color-on-surface);
  /* 背景跟随主题，**不能写死深色**：iOS 独立模式下视口偶尔比屏幕矮一条（WebKit bug），
     露出来的那条就是 body 背景——写死 #0b0a0e 时深色下是一条黑边，浅色下更刺眼。
     跟随主题后，即使露出来也看不出接缝。 */
  background: var(--md-sys-color-surface);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

/* 桌面预览才有那块深色展台和光晕；手机上不画，免得万一露出底色时看到的是渐变而不是纯色 */
@media (min-width: 720px) {
  body { background: #0b0a0e; }
}
@media (max-width: 719px) {
  body::before { display: none; }
}

/* 桌面预览：把页面放进一台"手机"里居中显示 */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(60% 50% at 50% 0%, color-mix(in srgb, var(--md-sys-color-primary) 10%, transparent), transparent 70%),
    radial-gradient(40% 40% at 85% 90%, color-mix(in srgb, var(--c-info) 8%, transparent), transparent 70%);
  pointer-events: none;
}

.stage {
  /* 贴初始包含块的四条边，**不用任何高度单位**：iOS 独立模式下 100vh/100dvh/dvh/svh、
     window.innerHeight、-webkit-fill-available **全都会低报**（WebKit bug），
     算高度这条路走不通；position:fixed + inset:0 是唯一稳的（cocktail-atlas #2 的做法）。 */
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 0;
}

.phone {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 430px;
  height: 100%;
  overflow: hidden;
  background: var(--md-sys-color-surface);
  color: var(--md-sys-color-on-surface);
}

@media (min-width: 720px) {
  .stage { padding: 24px; }
  .phone {
    height: min(920px, 100%);
    border-radius: 44px;
    box-shadow: 0 40px 80px -20px rgba(0, 0, 0, .65), 0 0 0 10px #17161b, 0 0 0 11px #34323a;
  }
}

/* 刷新加载条：贴在顶栏下沿的一条细线，任何一次刷新（轮询/手动/切页）都亮一下。
   数据在悄悄变、页面却毫无动静，用户会以为没刷新（用户提的）。层级 5：压住内容里的浮层、
   但不盖顶栏(6)和底栏(7)。 */
.loadbar {
  position: absolute; left: 0; right: 0; top: var(--topbar-h);
  z-index: 5; height: 2px; overflow: hidden;
  opacity: 0; transition: opacity var(--dur-short) var(--ease-standard);
  pointer-events: none;
}
.loadbar.on { opacity: 1; }
.loadbar::after {
  content: "";
  position: absolute; top: 0; bottom: 0; width: 42%;
  border-radius: 2px;
  background: linear-gradient(90deg, transparent, var(--md-sys-color-primary), transparent);
  animation: loadslide 1.05s var(--ease-standard) infinite;
}
@keyframes loadslide {
  0% { transform: translateX(-110%); }
  100% { transform: translateX(340%); }
}
@media (prefers-reduced-motion: reduce) {
  .loadbar::after { animation: none; left: 0; right: 0; width: auto; background: var(--md-sys-color-primary); opacity: .6; }
}
/* 滚动区：顶栏是绝对定位浮在上面的，所以上边留出顶栏的高度；
   左右留白（--gutter）就加在这一层，卡片的左右边缘随之与顶栏对齐。
   滚动条一律不占位：它一占位右侧就比左侧多出十几像素，看着就是"没居中"。 */
.scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  scrollbar-width: none;
  padding: calc(var(--topbar-h) + 10px) var(--gutter) calc(96px + var(--sab));
}
.scroll::-webkit-scrollbar { width: 0; height: 0; }

/* 页面容器：所有区块（卡片、快捷操作、提示条）都是它的直接子元素，
   间距统一由 gap 给，任何模块都不需要自己写 margin-top。 */
.page { display: flex; flex-direction: column; gap: var(--gap); }

.tnum { font-variant-numeric: tabular-nums; }

/* ============================ 顶栏 ============================ */
.topbar {
  position: absolute;
  left: 0; right: 0; top: 0;
  /* 层级：内容里的浮层最高到 4（地图版权），顶栏/底栏取 6/7 稳压它们；
     再往上依次是遮罩 8、弹层 9、提示 20。改这里前先看那一串。 */
  z-index: 6;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: calc(10px + var(--sat)) var(--gutter) 10px;
  background: linear-gradient(to bottom, var(--md-sys-color-surface) 72%, transparent);
}

.vswitch {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  flex: 1 1 auto;
  padding: 6px 8px 6px 0;
  border: 0;
  border-radius: var(--shape-full);
  background: transparent;
  color: inherit;
  font: inherit;
  cursor: pointer;
  transition: background var(--dur-short) var(--ease-standard);
}
.vswitch .vtext { min-width: 0; text-align: left; display: block; }
.vswitch .vname { display: block; font-size: 15px; font-weight: 600; letter-spacing: .1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vswitch .vsub { display: block; font-size: 11px; color: var(--md-sys-color-on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vswitch:hover { background: color-mix(in srgb, var(--md-sys-color-on-surface) calc(var(--hover) * 100%), transparent); }
.vswitch:active { transform: scale(.98); }

.spacer { flex: 1; }

.iconbtn {
  position: relative;
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border: 0; border-radius: var(--shape-full);
  background: transparent; color: var(--md-sys-color-on-surface-variant);
  cursor: pointer;
  transition: background var(--dur-short) var(--ease-standard), color var(--dur-short) var(--ease-standard);
}
.iconbtn:hover { background: color-mix(in srgb, var(--md-sys-color-on-surface) calc(var(--hover) * 100%), transparent); }
.iconbtn:active { transform: scale(.94); }
.iconbtn.sm { width: 30px; height: 30px; }
.iconbtn.on { color: var(--md-sys-color-primary); }
.iconbtn.spin svg { animation: spin 900ms linear infinite; }
/* 图标按钮有 40px 的状态层，图标本身要跟内容边缘对齐就得往右借 8px */
.topbar > .iconbtn:last-child { margin-right: -8px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ============================ 胶囊 ============================ */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 26px;
  padding: 0 10px;
  border-radius: var(--shape-full);
  background: var(--md-sys-color-surface-container-high);
  color: var(--md-sys-color-on-surface-variant);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .3px;
  white-space: nowrap;
}
.chip .dot { width: 6px; height: 6px; border-radius: 99px; background: currentColor; flex: none; }
.chip.ok { background: color-mix(in srgb, var(--c-success) 16%, transparent); color: var(--c-success); }
.chip.warn { background: color-mix(in srgb, var(--c-warning) 18%, transparent); color: var(--c-warning); }
.chip.bad { background: color-mix(in srgb, var(--c-danger) 18%, transparent); color: var(--c-danger); }
.chip.info { background: color-mix(in srgb, var(--c-info) 18%, transparent); color: var(--c-info); }
.chip.charge { background: color-mix(in srgb, var(--c-charge) 18%, transparent); color: var(--c-charge); }
.chip.pulse .dot { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }

/* ============================ 卡片 ============================ */
.card {
  position: relative;
  padding: 14px 16px;
  border-radius: 18px;
  background: var(--md-sys-color-surface-container-low);
  border: 1px solid color-mix(in srgb, var(--md-sys-color-outline-variant) 55%, transparent);
}
.card.plain { background: var(--md-sys-color-surface-container); }

.card-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.card-title { font-size: 15px; font-weight: 600; letter-spacing: .1px; }
.card-sub { font-size: 12px; color: var(--md-sys-color-on-surface-variant); }
.card-head .iconbtn { margin: -8px -8px -8px 0; width: 34px; height: 34px; }
/* 卡头右侧动作区：必须是 flex——.iconbtn 是 display:grid（块级），
   直接塞进普通 div 里两个按钮会竖着堆，卡头就高出一倍（位置卡的眼睛+导航踩过） */
.card-head .card-actions { margin-left: auto; display: flex; align-items: center; gap: 2px; }

.section-title {
  display: flex; align-items: center; gap: 8px;
  margin: 4px 0 0;                /* 加上 .page 的 gap，视觉上距上一块 16px */
  font-size: 12.5px; font-weight: 600; letter-spacing: .4px;
  color: var(--md-sys-color-on-surface-variant);
}
.section-title .line { flex: 1; height: 1px; background: color-mix(in srgb, var(--md-sys-color-outline-variant) 70%, transparent); }

/* ============================ 首屏车辆区 ============================ */
/* 车图、电量、续航、进度条收在一张卡里，两个大数字压在车图左右两侧：
   比"车图一行 + 数字一行 + 进度条一行 + meta 一行"省掉三行，
   而且所有文字都落在卡片的 16px 内边距上，不再往页面边上飘。 */
.hero-card { padding: 12px 16px 14px; }

.hero-top { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.hero-top .spacer { flex: 1 1 0; min-width: 0; }

.hero-stage {
  position: relative;
  /* 自成层叠上下文：车图、大数字、胎压气泡的 z-index 只在本区内部比较，
     不会漏到根层叠上下文去跟顶栏/底栏抢层级（气泡曾因此盖住顶栏文字） */
  isolation: isolate;
  height: 148px;
  display: grid;
  place-items: center;
  margin: 2px 0;
}
.hero-stage::before {             /* 展台光晕：把透明底车图从背景里托出来 */
  content: "";
  position: absolute;
  left: 50%; top: 48%;
  width: 108%; aspect-ratio: 1.9;
  transform: translate(-50%, -50%);
  background: radial-gradient(closest-side, var(--glow), transparent 72%);
  filter: blur(6px);
  pointer-events: none;
}
.hero-stage img, .hero-stage svg.fallback {
  position: relative;
  z-index: 1;
  max-width: 70%;
  max-height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 16px 20px rgba(0, 0, 0, .38));
}
/* 车图入场动画：只有首屏那次渲染的元素带 .hero-in，之后的重渲染（切 tab、每 30 秒轮询）
   都不带——因为"元素摘下来再插回去"会让 CSS 动画重新开始，切一下 tab 就是"车图动两次"（用户报的）。
   类挂在元素上，后续渲染出来的新元素没有这个类，自然不会再播。 */
.hero-stage .hero-in {
  animation: heroIn var(--dur-long) var(--ease-decel) both;
}
[data-theme="dark"] .hero-stage img { filter: drop-shadow(0 16px 20px rgba(0, 0, 0, .55)) drop-shadow(0 0 1px rgba(255, 255, 255, .22)); }
@keyframes heroIn { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }

.bignum {
  position: absolute; top: 44%; transform: translateY(-50%);
  z-index: 2;
  display: flex; align-items: baseline; gap: 2px;
}
.bignum.left { left: 0; }
.bignum.right { right: 0; }
.bignum b { font-size: 34px; line-height: 36px; font-weight: 600; letter-spacing: -1.2px; }
.bignum i { font-style: normal; font-size: 13px; font-weight: 600; opacity: .6; margin-left: 2px; letter-spacing: 0; }

/* 胎压气球：挂在车图前/后轮外侧，单行「2.3 bar 24°」；位置即轮位，所以不写「前轮/后轮」 */
.tirebub {
  position: absolute;
  z-index: 3;
  display: flex; align-items: baseline; gap: 3px;
  padding: 4px 9px 5px;
  border-radius: 11px;
  background: color-mix(in srgb, var(--md-sys-color-surface-container-highest) 86%, transparent);
  border: 1px solid color-mix(in srgb, var(--md-sys-color-outline-variant) 60%, transparent);
  backdrop-filter: blur(8px);
  box-shadow: var(--el1);
  pointer-events: none;
  white-space: nowrap;
}
.tirebub.left { left: 0; bottom: 4%; }
.tirebub.right { right: 0; bottom: 4%; }
.tirebub .pv { font-size: 15px; font-weight: 600; letter-spacing: -.3px; }
.tirebub .pu { font-size: 9px; font-weight: 500; opacity: .6; }
.tirebub .pt { font-size: 10px; color: var(--md-sys-color-on-surface-variant); margin-left: 1px; }
.tirebub.ok .pv { color: var(--c-success); }
.tirebub.warn .pv { color: var(--c-warning); }
.tirebub.bad .pv { color: var(--c-danger); }

.hero-meta {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin-top: 9px;
  font-size: 11.5px; color: var(--md-sys-color-on-surface-variant);
}
.hero-meta .sep { width: 3px; height: 3px; border-radius: 99px; background: currentColor; opacity: .5; }

/* 高密度小格：一格 = 标签 + 数值 + 小字说明 */
.tile { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile .k { font-size: 10.5px; color: var(--md-sys-color-on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v { font-size: 17px; font-weight: 600; letter-spacing: -.3px; white-space: nowrap; }
.tile .v small { font-size: 10px; font-weight: 500; opacity: .65; margin-left: 2px; letter-spacing: 0; }
.tile .s { font-size: 10.5px; color: var(--md-sys-color-on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.bar {
  position: relative;
  height: 6px;
  margin: 10px 0 0;
  border-radius: 99px;
  background: color-mix(in srgb, var(--md-sys-color-on-surface) 10%, transparent);
  overflow: hidden;
}
.bar > i {
  position: absolute; inset: 0 auto 0 0;
  border-radius: 99px;
  background: linear-gradient(90deg, color-mix(in srgb, var(--bar-c, var(--c-success)) 70%, #fff 0%), var(--bar-c, var(--c-success)));
  transition: width var(--dur-long) var(--ease-decel);
}
.bar.charging > i { background-image: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.55) 50%, transparent 100%), linear-gradient(90deg, var(--bar-c), var(--bar-c)); background-size: 40% 100%, 100% 100%; background-repeat: no-repeat; animation: flow 1.8s linear infinite; }
@keyframes flow { from { background-position: -60% 0, 0 0; } to { background-position: 160% 0, 0 0; } }

.hero-meta {
  display: flex; align-items: center; gap: 10px;
  margin: 14px 4px 0;
  font-size: 12px; color: var(--md-sys-color-on-surface-variant);
}
.hero-meta .sep { width: 3px; height: 3px; border-radius: 99px; background: currentColor; opacity: .5; }

/* ============================ 快捷操作 ============================ */
/* 这一排是按钮（比卡片亮一级的 surface-container），和下面的卡片有明确的层级差，
   加上 .page 的 gap，不会再和「车辆位置」糊成一块。 */
.actions {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.action {
  position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px;
  min-height: 64px;
  padding: 7px 4px;
  border: 1px solid color-mix(in srgb, var(--md-sys-color-outline-variant) 55%, transparent);
  border-radius: 14px;
  background: var(--md-sys-color-surface-container);
  color: var(--md-sys-color-on-surface);
  font: inherit; font-size: 11.5px;
  cursor: pointer;
  transition: transform var(--dur-short) var(--ease-standard), background var(--dur-short) var(--ease-standard);
}
.action:hover { background: var(--md-sys-color-surface-container-high); }
.action:active { transform: scale(.955); }
.action .ico { width: 26px; height: 26px; display: grid; place-items: center; border-radius: var(--shape-full); background: color-mix(in srgb, var(--md-sys-color-primary) 12%, transparent); color: var(--md-sys-color-primary); }
.action.on .ico { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }
.action .lbl { font-weight: 500; }
.action .st { font-size: 10px; color: var(--md-sys-color-on-surface-variant); }
.action[disabled] { opacity: .45; pointer-events: none; }
.action.busy .ico svg { animation: spin 900ms linear infinite; }

/* ============================ 数据小格 ============================ */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid2 > .card + .card { margin-top: 0; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 8px; }

/* 位置卡 + 骑行卡并排（各占一半宽）。共享车没有骑行卡，位置卡整行、内部再排成一行。
   半宽卡的高度要压住：卡头、地图、小格行高都比整宽卡紧一档，否则两张卡吃掉半屏。 */
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
.duo > .card { min-width: 0; padding: 11px 12px 9px; }
.duo .card-title { font-size: 14px; }
.duo .card-sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.duo .card-head { gap: 4px; margin-bottom: 8px; }
.duo .card-head .iconbtn { width: 30px; height: 30px; margin: -6px -6px -6px 0; }
.duo .mapbox.sm { height: 96px; }
.duo .kv { gap: 6px; padding: 6px 0; }
.duo .kv .k, .duo .kv .v { font-size: 12px; }
.duo .grid2 { gap: 6px 8px; }
.duo .tile { gap: 1px; }
.duo .tile .k { font-size: 10px; line-height: 1.2; }
.duo .tile .v { font-size: 14px; line-height: 1.15; }
.duo .tile .v small { font-size: 9px; }
.duo .bars { height: 58px; gap: 6px; }
.duo .bars .b span { font-size: 10px; }
.duo .card-sub.mt8 { display: none; }   /* 半宽下"最近 7 天里程"那行提示太挤，藏掉 */

/* 位置卡的"更新时间 · 海拔"一行小字 */
.loc-meta {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  margin-top: 8px;
  font-size: 11px; color: var(--md-sys-color-on-surface-variant);
  white-space: nowrap;
}
.loc-meta-col { display: flex; flex-direction: column; gap: 10px; }
.loc-meta-col > div { display: flex; flex-direction: column; gap: 2px; }
.loc-meta-col span { font-size: 11px; color: var(--md-sys-color-on-surface-variant); }
.loc-meta-col b { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
/* 坐标那行比时间/海拔长，字号收一点、用等宽，免得右列被撑开或折行 */
.loc-meta-col .wide b { font-size: 12px; font-weight: 500; }

/* 共享车：位置卡整行，地图和信息并排 */
.loc-row { display: grid; grid-template-columns: 42% 1fr; gap: 12px; align-items: start; }
.loc-row .mapbox { height: 116px; }
.loc-row .kv:first-child { padding-top: 0; }
.loc-row .kv:last-child { padding-bottom: 0; }

.stat { display: flex; flex-direction: column; gap: 4px; }
.stat .k { font-size: 11px; color: var(--md-sys-color-on-surface-variant); }
.stat .v { font-size: 19px; font-weight: 600; letter-spacing: -.2px; }
.stat .v small { font-size: 11px; font-weight: 500; opacity: .7; margin-left: 2px; }

.kv { display: flex; align-items: center; gap: 12px; padding: 8.5px 0; border-bottom: 1px solid color-mix(in srgb, var(--md-sys-color-outline-variant) 45%, transparent); }
.kv:last-child { border-bottom: 0; padding-bottom: 0; }
.kv:first-child { padding-top: 0; }
/* 开关也要靠右：.kv 里只有 .v 写了 margin-left:auto，开关没有，会紧跟在文字后面 */
.kv > .switch { margin-left: auto; }
.kv .k { font-size: 13px; color: var(--md-sys-color-on-surface-variant); min-width: 0; }
.kv .v { margin-left: auto; font-size: 13px; font-weight: 500; text-align: right; white-space: nowrap; }
.kv .v.mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 12px; }
.kv .raw {
  font-size: 10px; color: var(--md-sys-color-on-surface-variant); opacity: .7;
  display: block; font-family: ui-monospace, Consolas, monospace;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.kv.kv-act { cursor: pointer; }

/* ============================ 设置页：可折叠分组 ============================ */
/* 分组卡整张不留内边距，头部自己撑满——这样点哪儿都能展开，热区够大 */
.card.group-card { padding: 0; overflow: hidden; }
.group-head {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 13px 14px;
  border: 0; background: transparent; color: inherit; font: inherit;
  text-align: left; cursor: pointer;
  transition: background var(--dur-short) var(--ease-standard);
}
.group-head:hover { background: color-mix(in srgb, var(--md-sys-color-on-surface) calc(var(--hover) * 100%), transparent); }
.group-head .gi {
  flex: none; width: 30px; height: 30px; display: grid; place-items: center;
  border-radius: 9px;
  background: var(--md-sys-color-surface-container-high);
  color: var(--md-sys-color-on-surface-variant);
}
.group-head .gt { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; letter-spacing: .1px; }
.group-head .gc {
  flex: none; font-size: 11px; font-weight: 600;
  color: var(--md-sys-color-on-surface-variant);
  background: color-mix(in srgb, var(--md-sys-color-on-surface) 8%, transparent);
  padding: 2px 7px; border-radius: 99px;
}
.group-head .gv {
  flex: none; display: grid; place-items: center;
  color: var(--md-sys-color-on-surface-variant);
  transition: transform var(--dur-med) var(--ease-standard);
}
.group-head.open .gv { transform: rotate(180deg); }
.group-head.open { border-bottom: 1px solid color-mix(in srgb, var(--md-sys-color-outline-variant) 45%, transparent); }
.group-body { padding: 2px 14px 10px; }

/* 柱状图 */
.bars { display: flex; align-items: flex-end; gap: 5px; height: 56px; margin-top: 2px; }
.bars .b { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.bars .b > i { width: 100%; border-radius: 6px 6px 3px 3px; background: color-mix(in srgb, var(--md-sys-color-primary) 75%, transparent); min-height: 3px; transition: height var(--dur-med) var(--ease-decel); }
.bars .b.today > i { background: var(--md-sys-color-primary); }
.bars .b span { font-size: 9px; color: var(--md-sys-color-on-surface-variant); }

/* 胎压 */

/* 地图 */
.mapbox {
  position: relative;
  height: 134px;
  border-radius: var(--shape-l);
  overflow: hidden;
  background: var(--md-sys-color-surface-container-high);
}
/* 骑行轨迹用：轨迹是竖着的，扁框装不下会被上下裁掉 */
.mapbox.tall { height: 240px; }
/* 两栏里的位置图：只有半格宽，高度也收一半，不然整张卡被地图撑高 */
.mapbox.sm { height: 96px; }
.mapbox.sm .unmask { font-size: 10.5px; gap: 4px; }
.mapbox.sm .unmask .ico svg { width: 16px; height: 16px; }

/* 首页位置卡：默认不显示位置（连瓦片都不请求），点眼睛才出来 */
.mapbox.hidden-loc {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;
  background: var(--md-sys-color-surface-container-high);
  color: var(--md-sys-color-on-surface-variant);
  font-size: 12px; font-weight: 600;
}

/* 大地图（弹层里）：多点标记 */
.mapbox.big { height: 420px; cursor: default; }
.mapbox .mk {
  position: absolute; left: 50%; top: 50%; z-index: 2;
  border-radius: 99px; display: grid; place-items: center;
}
.mapbox .mk.car {
  width: 18px; height: 18px;
  background: var(--md-sys-color-primary);
  box-shadow: 0 0 0 5px color-mix(in srgb, var(--md-sys-color-primary) 26%, transparent), 0 2px 8px rgba(0, 0, 0, .45);
}
.mapbox .mk.me {
  width: 16px; height: 16px;
  background: #2f80ed;
  box-shadow: 0 0 0 5px rgba(47, 128, 237, .24), 0 2px 8px rgba(0, 0, 0, .45);
}
.mapbox .mk .mkl {
  position: absolute; bottom: 150%; left: 50%; transform: translateX(-50%);
  white-space: nowrap; font-size: 10px; font-weight: 600;
  padding: 2px 6px; border-radius: 6px;
  background: color-mix(in srgb, var(--md-sys-color-surface) 90%, transparent);
  color: var(--md-sys-color-on-surface);
  box-shadow: var(--el1);
}
.mapbox .tiles { position: absolute; inset: 0; filter: var(--map-filter); }
.mapbox .tiles img { position: absolute; width: 256px; height: 256px; user-select: none; }
.mapbox .pin {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -100%);
  color: var(--md-sys-color-primary);
  filter: drop-shadow(0 3px 6px rgba(0, 0, 0, .45));
  transition: opacity var(--dur-med) var(--ease-standard);
}
.mapbox .pin::after { content: ""; position: absolute; left: 50%; top: 100%; width: 14px; height: 5px; transform: translate(-50%, -2px); border-radius: 99px; background: rgba(0,0,0,.3); }
.mapbox .mapload { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; color: var(--md-sys-color-on-surface-variant); }

/* 位置默认打码：瓦片模糊 + 精确坐标用文字盖住，点地图（或卡头那只眼睛）才揭开。
   模糊只作用在瓦片层，署名和遮罩文字保持清晰。 */
.mapbox { cursor: pointer; }
.mapbox.masked .tiles { filter: blur(16px) saturate(.75) var(--map-filter); transform: scale(1.08); }
.mapbox.masked .pin { opacity: 0; }
.mapbox.masked .track { filter: blur(9px); opacity: .5; }
.mapbox .track { transition: filter var(--dur-med) var(--ease-standard), opacity var(--dur-med) var(--ease-standard); }
.mapbox .tiles { transition: filter var(--dur-med) var(--ease-standard), transform var(--dur-med) var(--ease-standard); }
.mapbox .unmask {
  position: absolute; inset: 0; z-index: 3;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;
  border: 0; padding: 0;
  background: color-mix(in srgb, var(--md-sys-color-surface) 42%, transparent);
  color: var(--md-sys-color-on-surface);
  font: inherit; font-size: 12px; font-weight: 600; letter-spacing: .2px;
  cursor: pointer;
}
.mapbox .unmask .ico {
  display: grid; place-items: center;
  width: 36px; height: 36px; border-radius: var(--shape-full);
  background: var(--md-sys-color-surface-container-highest);
  box-shadow: var(--el1);
}
.mapbox .unmask span { text-shadow: 0 1px 2px rgba(0, 0, 0, .25); }

/* 骨架屏 */
.sk { position: relative; overflow: hidden; background: color-mix(in srgb, var(--md-sys-color-on-surface) 8%, transparent); border-radius: var(--shape-s); }
.sk::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--md-sys-color-on-surface) 8%, transparent), transparent); animation: shimmer 1.4s infinite; }
@keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

/* ============================ 按钮 ============================ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; padding: 0 20px;
  border: 0; border-radius: var(--shape-full);

/* ============================ 底部弹层 ============================ */

.switch { position: relative; width: 48px; height: 30px; flex: none; border-radius: 99px; background: var(--md-sys-color-surface-container-highest); box-shadow: inset 0 0 0 1px var(--md-sys-color-outline); transition: background var(--dur-short) var(--ease-standard); }
