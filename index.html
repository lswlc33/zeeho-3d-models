<!doctype html>
<html lang="zh-CN" data-theme="dark" data-accent="purple">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- 缩放三处一起禁（双击 + 双指）：viewport 这三条是给安卓/其它认它的浏览器兜底；
     iOS Safari 从 iOS 10 起就忽略 user-scalable/maximum-scale（无障碍考虑），
     那边靠 CSS 的 touch-action: pan-x pan-y 和 app.js 里的 gesture*/两指 touchmove 拦截。 -->
<!-- 两个 theme-color：JS 没跑之前浏览器按系统偏好自己挑（跑起来后 applyTheme 会接管）。
     值 = 页面底色（浅色是 --bg-page 的 #f3edf7，深色 #141218），跟页面**不是**同一个值时状态栏会有一条色带。
     系统深浅色，Android 用上面那条 meta 给状态栏/地址栏着色。 -->
<meta name="theme-color" content="#f3edf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141218" media="(prefers-color-scheme: dark)">
<meta name="description" content="脱离极核 App 的车辆面板：车况、骑行记录与设置">
<!-- 构建号：build-static.mjs 出包时把 content 里的占位符换成时间戳（到秒），同一份值另写一份进 version.json。
     独立 PWA 从后台恢复不会重新加载页面，app.js 拿它比对后自动整页重载（见 app.js 的 checkBuild，
     那边的 isBuildId 正则要跟这里的格式一起改）。
     占位符别写成 __BUILD__ 那类下划线串：页面里的 JS 也要整文件替换一遍，会把代码里的字面量一起改掉（踩过）。 -->
<meta name="build" content="2026-10-16 23:22:51">
<title>极核面板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237457b8'/%3E%3Cpath d='M18 5 9 18h5l-1.4 9L22 14h-5.2z' fill='%23e7ddff'/%3E%3C/svg%3E">
<script>
  // 首屏主题与强调色都必须在样式之前定下来：否则深色手机上会先闪一下浅色底，
  // 强调色不对还会先闪一帧默认色。与 app.js 用同一个 localStorage 键；没存过就跟随系统 / 用默认（淡紫）。
  // ⚠️ accent 只在 `accentV` 是当前版本时才认：老档案里存的是旧的默认色（绿），
  //    直接认它等于这次改默认色对老用户不生效（app.js:loadPrefs 会做一次性迁移）。
  (function () {
    try {
      var p = JSON.parse(localStorage.getItem('zeeho.dash') || '{}');
      var sys = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = (p.theme === 'light' || p.theme === 'dark') ? p.theme : sys;
      if ((p.accentV || 0) >= 2 && (p.accent === 'blue' || p.accent === 'purple' || p.accent === 'green')) {
        document.documentElement.dataset.accent = p.accent;
      }
    } catch (e) { /* 保持 <html> 上的默认值 */ }
  })();
  // 独立 PWA：先把文档撑到屏幕高，iOS 才会给出完整视口（否则底部留一条黑边、顶上顶栏钻到状态栏底下）。
  // 放这里是为了赶在首屏绘制之前；app.js 起来后会写同一个值（那边是权威实现，见 fitViewport）。
  try {
    if ((navigator.standalone === true || matchMedia('(display-mode: standalone)').matches) && screen.height > window.innerHeight) {
      document.documentElement.style.minHeight = screen.height + 'px';
    }
  } catch (e) { /* 忽略 */ }
</script>
<style>
/* ============================================================================
   极核面板 · 样式
   ----------------------------------------------------------------------------
   设计令牌按 Material 3 语义槽位命名（--md-sys-*），数值取自 Material Web 的
   token 源（v34.0.21，M3 Expressive 同期），与模块 App 的 M3 主题同一套语义，
   将来界面挪进 App 时好对齐。改配色只动这一节，组件样式一律引用变量。
   ========================================================================= */

:root {
  color-scheme: light;
  /* 瓦片滤镜：浅色是空串（拼在 blur 后面不会让整条 filter 失效；写 none 会让 filter 整条作废）。
     深色见 [data-theme="dark"] —— 高德栅格瓦片没有夜间版，只能反相压暗。 */
  --map-filter: ;

  /* ---------- 浅色 ---------- */
  --md-sys-color-surface: #fef7ff;
  --md-sys-color-surface-dim: #ded8e1;
  --md-sys-color-surface-container-lowest: #ffffff;
  --md-sys-color-surface-container-low: #f7f2fa;
  --md-sys-color-surface-container: #f3edf7;
  --md-sys-color-surface-container-high: #ece6f0;
  --md-sys-color-surface-container-highest: #e6e0e9;
  --md-sys-color-on-surface: #1d1b20;
  --md-sys-color-on-surface-variant: #49454f;
  --md-sys-color-outline: #79747e;
  --md-sys-color-outline-variant: #cac4d0;
  --md-sys-color-inverse-surface: #322f35;
  --md-sys-color-inverse-on-surface: #f5eff7;
  --md-sys-color-scrim: #000;

  /* 品牌强调色：**默认「淡紫」**（用户 2026-10-15 指定；深色那份在 [data-theme="dark"] 里）。
     data-accent 由 index.html 与 app.js 写入：purple(默认) / blue / green，见文件后半的预设块。 */
  --md-sys-color-primary: #7457b8;
  --md-sys-color-on-primary: #ffffff;
  --md-sys-color-primary-container: #e7ddff;
  --md-sys-color-on-primary-container: #452d7a;

  /* 状态色：M3 没有 success/warning 槽位，按行业惯例取值（见 MUI palette） */
  --c-success: #2e7d32;
  --c-success-container: #c8e6c9;
  --c-warning: #b26a00;
  --c-warning-container: #ffe0b2;
  --c-danger: #b3261e;
  --c-danger-container: #f9dedc;
  --c-info: #00629e;
  --c-info-container: #cde5ff;
  --c-charge: #0b7bc1;

  --glow: color-mix(in srgb, var(--md-sys-color-primary) 26%, transparent);
  --glow-soft: color-mix(in srgb, var(--md-sys-color-primary) 12%, transparent);
  --tint: color-mix(in srgb, var(--md-sys-color-primary) 8%, transparent);

  /* ---------- 形状 ---------- */
  --shape-xs: 4px;
  --shape-s: 8px;
  --shape-m: 12px;
  --shape-l: 16px;
  --shape-xl: 20px;
  --shape-2xl: 28px;
  --shape-full: 9999px;

  /* ---------- 扁平化的三层色阶（**不用阴影、不用描边**） ----------
     深度只靠这三档颜色 + 间距：页面底 → 面（卡片 / 操作块 / 弹层）→ 内嵌块（输入框 / 代码块 / 图标底）。
     浅色下页面必须比面**暗**一档（面是纯白）——否则卡片就糊在页面里，只能靠阴影去找，那就不叫扁平了；
     深色下反过来（面比页面亮一档，见 [data-theme="dark"]）。改配色只动这三行。 */
  --bg-page: var(--md-sys-color-surface-container);
  --bg-surface: var(--md-sys-color-surface-container-lowest);
  --bg-inset: var(--md-sys-color-surface-container-high);
  /* 色环（**不是阴影**）：扁平设计里要把小块从杂色背景上抠出来，用实色环，颜色跟着它所在的那一层走 */
  --ring-page: 0 0 0 2px var(--bg-page);

  /* 底栏选中项的配色。浅色下用"容器色"（tone 90 的淡紫块 + 深字）就够了；
     深色下**不能**也用容器色——深色主题的容器是 tone 30 的"深底浅字"，放进玻璃底栏是一块很深的紫
     （用户 2026-10-15 说"底栏的紫色太深"）。深色那份改用 primary 本身（tone 80 的浅色档 + on-primary 深字），
     观感与浅色主题统一，而且三套强调色不用各写一遍。 */
  --tab-sel-bg: var(--md-sys-color-primary-container);
  --tab-sel-fg: var(--md-sys-color-on-primary-container);

  /* 会员卡（极核 SVIP）的金色。**纯色**（用户 2026-10-16："背景不符合扁平化设计，最好是纯色，图案可以保留"）——
     渐变和扫光都删了，只留王冠水印那一层图案；全站"不加阴影、不加细线"的规则当然继续管着它。
     浅色 = 亮金底 + 深金棕字，深色 = 古铜底 + 亮金字；两边的字色都按对比度挑过（金底上的字最容易糊，
     小的统计标签也要 ≥4.5:1）。 */
  --svip-bg: #d4af37;
  --svip-ink: #4a3200;
  --svip-ink-soft: #5a3c02;
  --svip-badge-bg: rgba(74, 50, 0, .14);
  --svip-avatar-bg: rgba(255, 255, 255, .5);

  /* iOS 独立 PWA：视口会比屏幕矮掉状态栏那一条（WebKit bug 301108），**只要文档本身够高，
   iOS 就会把完整视口给出来**（frappe/frappe-ui #1289 的结论），固定壳才铺得到底边。
   这里只是兜底（app.js:fitViewport 会按 screen.height 写死一个更准的值，行内样式优先级更高）：
   用 `100% + 状态栏高度`——别写 min(100lvh, …)，实测那台 iOS 26 上 lvh 本身就低报，一卡等于没撑。
   （display-mode: standalone 只在"添加到主屏幕"后成立，浏览器里打开不受影响。） */
@media (display-mode: standalone) {
  html { min-height: calc(100% + env(safe-area-inset-top, 0px)); }
}

/* 注意：--sat/--sab 的最终值由 JS（app.js:fitViewport）按"页面哪条边顶到屏幕"分别写死，
   写在 <html> 的行内样式上；这里不再用 .edge 之类的选择器去覆盖，免得两套机制打架。
   JS 没跑起来时就用 :root 里的原始 env() 值。 */

/* ---------- 状态层 ---------- */
  --hover: .08;
  --pressed: .10;

  /* ---------- 动效 ---------- */
  --ease-standard: cubic-bezier(.2, 0, 0, 1);
  --ease-decel: cubic-bezier(.05, .7, .1, 1);
  --ease-accel: cubic-bezier(.3, 0, .8, .15);
  --dur-short: 150ms;
  --dur-med: 300ms;
  --dur-long: 500ms;

  /* ---------- 视口与安全区 ---------- */
  /* --sat/--sab：安全区。**独立 PWA 里全吃**（页面铺满整屏，不给就会出现"顶栏压到状态栏底下 /
     tab 标签被 home indicator 压住"）；浏览器标签页里页面夹在地址栏和工具栏之间，
     再按 env() 留白就是双份，所以只在视口真的顶到屏幕边时才吃（app.js:fitViewport 判断）。
     另外 fitViewport 还要把文档撑到 screen.height——iOS 26 独立 PWA 不给完整视口，
     底部会留一条底色，就是那个"黑边"。 */
  /* 原始值留着给 JS 判断用（--sat/--sab 是"最终要不要吃"的值，可能被 JS 清零） */
  --sat-raw: env(safe-area-inset-top, 0px);
  --sab-raw: env(safe-area-inset-bottom, 0px);
  --sat: var(--sat-raw);
  --sab: var(--sab-raw);

  /* ---------- 版式基准 ---------- */
  /* 页面左右留白：滚动区与顶栏都用它，保证卡片边缘和车名/头像在同一条竖线上。
     改这一个值就能整体调宽窄，不要再去给单个模块加 padding。 */
  --gutter: 16px;
  /* 区块之间的竖向间距：由 .page 的 gap 统一给（不要再用 .card + .card 那种相邻兄弟选择器，
     中间夹一个 div 就断链，卡片会直接贴在一起）。 */
  --gap: 12px;
  /* 顶栏高度：这里是兜底值，实际高度由 renderTop() 量完写回（车名换行、安全区都会改变它，
     写死会让内容被顶栏压住）。滚动区的上内边距 = 它 + 10px 间隙。 */
  --topbar-h: 72px;

  /* 悬浮底栏：离底边 10px + 栏高（实测约 74px，含 1px 描边，取整用）。
     滚动区底部补偿与 .toast 的位置都从这两个值算，**别在别处再写一个数字**——
     以前 104 / 108 是照注释里"条高约 62px"推的，而实际约 74px，且 toast 还忘了加 --sab，
     iOS 独立 PWA 下会被底栏压住 11px（2026-10-15 复查实测）。 */
  --tabbar-inset: 10px;
  --tabbar-h: 74px;

  /* MiSans 放最前（index.html 里引了它的 Medium/Bold 两个 @font-face，族名就叫 MiSans）；
     后面的系统字体是离线/CDN 不通时的兜底。 */
  --font: MiSans, system-ui, -apple-system, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Segoe UI", sans-serif;
}

[data-theme="dark"] {
  color-scheme: dark;
  /* 深色的三层色阶：面比页面亮一档（浅色那份是页面比面暗一档，方向相反但都是为了拉开层次） */
  --bg-page: var(--md-sys-color-surface);
  --bg-surface: var(--md-sys-color-surface-container-low);
  --bg-inset: var(--md-sys-color-surface-container-highest);
  /* 底栏选中项在深色下走 primary/on-primary（浅色档），别用容器色——那是深色块（见 :root 的说明） */
  --tab-sel-bg: var(--md-sys-color-primary);
  --tab-sel-fg: var(--md-sys-color-on-primary);
  /* 会员卡的深色档：也是纯色，古铜底 + 亮金字（浅色那块 #d4af37 放进深色主题会像贴错地方的亮纸片） */
  --svip-bg: #6f5210;
  --svip-ink: #ffe7ad;
  --svip-ink-soft: #f0cf8e;
  --svip-badge-bg: rgba(255, 231, 173, .16);
  --svip-avatar-bg: rgba(0, 0, 0, .22);
  /* 高德栅格瓦片只有白天样式：invert 反相 + hue-rotate(180) 把色相转回来，得到"深色底、浅色字"的地图，
     再压一点亮度和饱和度，免得反相后太扎眼。只作用在 .tiles 上——
     图钉、轨迹线、标记是我们自己画的，反相会把它们的颜色也带跑。 */
  --map-filter: invert(1) hue-rotate(180deg) brightness(.88) contrast(.92) saturate(.7);

  --md-sys-color-surface: #141218;
  --md-sys-color-surface-dim: #141218;
  --md-sys-color-surface-container-lowest: #0f0d13;
  --md-sys-color-surface-container-low: #1d1b20;
  --md-sys-color-surface-container: #211f26;
  --md-sys-color-surface-container-high: #2b2930;
  --md-sys-color-surface-container-highest: #36343b;
  --md-sys-color-on-surface: #e6e0e9;
  --md-sys-color-on-surface-variant: #cac4d0;
  --md-sys-color-outline: #938f99;
  --md-sys-color-outline-variant: #49454f;
  --md-sys-color-inverse-surface: #e6e0e9;
  --md-sys-color-inverse-on-surface: #322f35;

  /* 淡紫（默认强调色的深色档）：深底上的淡紫要更亮（M3 tone 80 的用法），
     直接拿浅色档（#7457b8）铺上去，动作图标、.btn.text 这些会糊在背景里 */
  --md-sys-color-primary: #cfbdf7;
  --md-sys-color-on-primary: #3a2a63;
  --md-sys-color-primary-container: #4b3a80;
  --md-sys-color-on-primary-container: #e7ddff;

  --c-success: #81c784;
  --c-success-container: #1f3d21;
  --c-warning: #ffb74d;
  --c-warning-container: #4a3200;
  --c-danger: #f2b8b5;
  --c-danger-container: #5c1813;
  --c-info: #7fc7ff;
  --c-info-container: #10405f;
  --c-charge: #7fc7ff;
}

/* 强调色预设 —— purple（**默认**，写在 :root 与 [data-theme="dark"] 里）/ blue / green
   ⚠️ 每套都要有**浅色 + 深色两份**。深色下 primary 是"在深底上使用"的颜色（M3 tone 80），
   直接拿浅色那份（tone 40）放上去对比度只有 2.4~3:1——动作按钮的图标、.btn.text、
   .rec-back 这些全都会糊掉（green 曾经缺这一块，2026-10-15 复查截图确认）。
   后加强调色时照这个格式补两块；`data-accent="purple"` 不需要单独的块——它就是默认那份。 */
:root[data-accent="blue"] {
  --md-sys-color-primary: #00629e;
  --md-sys-color-on-primary: #fff;
  --md-sys-color-primary-container: #cde5ff;
  --md-sys-color-on-primary-container: #00344f;
}
[data-theme="dark"][data-accent="blue"] {
  --md-sys-color-primary: #93ccff;
  --md-sys-color-on-primary: #003353;
  --md-sys-color-primary-container: #004a72;
  --md-sys-color-on-primary-container: #cde5ff;
}
/* 极核绿（可选）：原来它占着 :root 当默认色，2026-10-15 默认改成淡紫之后挪到这里，
   浅色那份要显式写出来（不然切回绿会落回默认的淡紫）。 */
:root[data-accent="green"] {
  --md-sys-color-primary: #426b00;
  --md-sys-color-on-primary: #ffffff;
  --md-sys-color-primary-container: #c3f18c;
  --md-sys-color-on-primary-container: #2a4300;
}
[data-theme="dark"][data-accent="green"] {
  --md-sys-color-primary: #a8d876;
  --md-sys-color-on-primary: #123800;
  --md-sys-color-primary-container: #2f5100;
  --md-sys-color-on-primary-container: #c3f18c;
}

/* ============================ 基础 ============================ */
* { box-sizing: border-box; }

/* 外层不做"文档滚动"：整个 App 是固定壳 + 内部滚动区，文档本身滚动只会带来问题
   （iOS 橡皮筋、键盘/scrollIntoView 把绝对定位的顶栏顶出视口）。 */
html, body { height: 100%; overflow: hidden; }

/* 根元素也铺主题底色：万一 iOS 还是少给了一条视口（撑高没生效、或撑高之前那一帧），
   露出来的是页面主色而不是白/黑——"黑边"最刺眼的就是浅色主题下露深色。
   （body 的底色会随之不再传播到画布，桌面预览那块深色展台仍由 body 自己的 background 负责。） */
html { background-color: var(--bg-page); }

/* 整屏固定壳没有"放大看看"的余地：一缩放视口，壳就被裁掉一截、而且基本回不来（用户实测踩到）。
   pan-x pan-y = 只留单指拖动（内部滚动区还要用），双击放大和双指缩放都不给；别写 none，那连拖动都没了。
   按规范浏览器会把被摸元素与祖先的 touch-action 取交集，所以写在根上就覆盖全部子元素。
   iOS 上双指缩放另有一道 JS 拦截（见 app.js 的"手势"一节）——Safari 忽略 viewport 的 user-scalable=no。 */
html, body { touch-action: pan-x pan-y; }

body {
  margin: 0;
  font-family: var(--font);
  font-size: 14px;
  line-height: 20px;
  color: var(--md-sys-color-on-surface);
  /* 背景跟随主题，**不能写死深色**：iOS 独立模式下视口偶尔比屏幕矮一条（WebKit bug），
     露出来的那条就是 body 背景——写死 #0b0a0e 时深色下是一条黑边，浅色下更刺眼。
     跟随主题后，即使露出来也看不出接缝。 */
  background: var(--bg-page);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

/* 桌面预览才有那块深色展台和光晕；手机上不画，免得万一露出底色时看到的是渐变而不是纯色 */
@media (min-width: 720px) {
  body { background: #0b0a0e; }
}
@media (max-width: 719px) {
  body::before { display: none; }
}

/* 桌面预览：把页面放进一台"手机"里居中显示 */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(60% 50% at 50% 0%, color-mix(in srgb, var(--md-sys-color-primary) 10%, transparent), transparent 70%),
    radial-gradient(40% 40% at 85% 90%, color-mix(in srgb, var(--c-info) 8%, transparent), transparent 70%);
  pointer-events: none;
}

.stage {
  /* 贴初始包含块的四条边，**不用任何高度单位**：iOS 独立模式下 100vh/100dvh/dvh/svh、
     window.innerHeight、-webkit-fill-available **全都会低报**（WebKit bug），
     算高度这条路走不通；position:fixed + inset:0 是唯一稳的（cocktail-atlas #2 的做法）。 */
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 0;
}

.phone {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 430px;
  height: 100%;
  overflow: hidden;
  background: var(--bg-page);
  color: var(--md-sys-color-on-surface);
}

@media (min-width: 720px) {
  .stage { padding: 24px; }
  .phone {
    height: min(920px, 100%);
    border-radius: 44px;
    box-shadow: 0 40px 80px -20px rgba(0, 0, 0, .65), 0 0 0 10px #17161b, 0 0 0 11px #34323a;
  }
}

/* 刷新加载条：贴在顶栏下沿的一条细线，任何一次刷新（轮询/手动/切页）都亮一下。
   数据在悄悄变、页面却毫无动静，用户会以为没刷新（用户提的）。层级 5：压住内容里的浮层、
   但不盖顶栏(6)和底栏(7)。 */
.loadbar {
  position: absolute; left: 0; right: 0; top: var(--topbar-h);
  z-index: 5; height: 2px; overflow: hidden;
  opacity: 0; transition: opacity var(--dur-short) var(--ease-standard);
  pointer-events: none;
}
.loadbar.on { opacity: 1; }
.loadbar::after {
  content: "";
  position: absolute; top: 0; bottom: 0; width: 42%;
  border-radius: 2px;
  background: linear-gradient(90deg, transparent, var(--md-sys-color-primary), transparent);
  animation: loadslide 1.05s var(--ease-standard) infinite;
}
@keyframes loadslide {
  0% { transform: translateX(-110%); }
  100% { transform: translateX(340%); }
}
@media (prefers-reduced-motion: reduce) {
  .loadbar::after { animation: none; left: 0; right: 0; width: auto; background: var(--md-sys-color-primary); opacity: .6; }
}
/* 滚动区：顶栏是绝对定位浮在上面的，所以上边留出顶栏的高度；
   左右留白（--gutter）就加在这一层，卡片的左右边缘随之与顶栏对齐。
   滚动条一律不占位：它一占位右侧就比左侧多出十几像素，看着就是"没居中"。 */
.scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  scrollbar-width: none;
  padding: calc(var(--topbar-h) + 10px) var(--gutter) calc(var(--tabbar-inset) + var(--tabbar-h) + 20px + var(--sab));
}
.scroll::-webkit-scrollbar { width: 0; height: 0; }

/* 页面容器：所有区块（卡片、快捷操作、提示条）都是它的直接子元素，
   间距统一由 gap 给，任何模块都不需要自己写 margin-top。 */
.page { display: flex; flex-direction: column; gap: var(--gap); }

/* 切页的横向过渡：底栏从左往右点，新内容就从右边滑进来（用户 2026-10-16 要的"横向移动"过渡）。
   位移刻意只有 14px：方向感够用即可，滑多了像在翻相册。类只在 tab **真的变了**那一次挂上
   （见 app.js render()），所以 30 秒轮询重绘不会每轮横滑一下。 */
@keyframes pageInFwd { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
@keyframes pageInBack { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
.page-fwd { animation: pageInFwd 260ms var(--ease-decel) both; }
.page-back { animation: pageInBack 260ms var(--ease-decel) both; }

.tnum { font-variant-numeric: tabular-nums; }

/* ============================ 顶栏 ============================ */
.topbar {
  position: absolute;
  left: 0; right: 0; top: 0;
  /* 层级：内容里的浮层最高到 4（地图版权），顶栏/底栏取 6/7 稳压它们；
     再往上依次是遮罩 8、弹层 9、提示 20。改这里前先看那一串。 */
  z-index: 6;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: calc(10px + var(--sat)) var(--gutter) 10px;
  background: linear-gradient(to bottom, var(--bg-page) 72%, transparent);
}

.vswitch {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  /* flex: 0 1 auto（原来 1 1 auto）：它右边本来就有一个 .spacer 占空白，再让它抢一份，
     盒子会比内容宽一大截（实测 184px 里 **65px 是空的**）——悬浮高亮就成了一坨伸出去很远的灰块。
     空白交给 .spacer 就行，这颗只管包住自己的内容（车名太长时照样缩、照样省略号）。 */
  flex: 0 1 auto;
  /* 左右各留 10px 给高亮，但**文字位置不动**：负外边距把盒子左移 10px 抵掉左内边距，
     车名仍然从 --gutter（卡片左边线）那条竖线起排——不然高亮的圆角会正好切在第一个字上。 */
  padding: 6px 10px;
  margin-left: -10px;
  border: 0;
  border-radius: var(--shape-l);
  background: transparent;
  color: inherit;
  font: inherit;
  cursor: pointer;
  transition: background var(--dur-short) var(--ease-standard);
}
.vswitch .vtext { min-width: 0; text-align: left; display: block; }
.vswitch .vname { display: block; font-size: 15px; font-weight: 600; letter-spacing: .1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vswitch .vsub { display: block; font-size: 11px; color: var(--md-sys-color-on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vswitch:active { transform: scale(.98); }

/* ==================== 悬浮高亮（只在真的能悬浮的设备上） ====================
   触屏上 `:hover` 是**粘的**：点一下车辆切换，那块灰底就一直挂在那儿不走（用户 2026-10-16 报的
   "悬浮高亮显示有问题"）。标准做法是把 hover 样式关在 `@media (hover: hover)` 里——
   触屏拿不到:hover，按下反馈由各自的 `:active` 给。加新的 hover 规则时也照这个包一层。 */
@media (hover: hover) {
  .vswitch:hover { background: color-mix(in srgb, var(--md-sys-color-on-surface) calc(var(--hover) * 100%), transparent); }
  .iconbtn:hover { background: color-mix(in srgb, var(--md-sys-color-on-surface) calc(var(--hover) * 100%), transparent); }
  .action:hover { background: var(--bg-inset); }
  .group-head:hover { background: color-mix(in srgb, var(--md-sys-color-on-surface) calc(var(--hover) * 100%), transparent); }
}

.spacer { flex: 1; }

.iconbtn {
  position: relative;
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border: 0; border-radius: var(--shape-full);
  background: transparent; color: var(--md-sys-color-on-surface-variant);
  cursor: pointer;
  transition: background var(--dur-short) var(--ease-standard), color var(--dur-short) var(--ease-standard);
}
.iconbtn:active { transform: scale(.94); }
.iconbtn.sm { width: 30px; height: 30px; }
/* 禁用态：任务面板标题行那两个小图标按钮在跑任务时要变灰（以前只有 .btn 有这条，
   小图标按钮一禁用看着还是可点的） */
.iconbtn[disabled] { opacity: .45; pointer-events: none; }
.iconbtn.on { color: var(--md-sys-color-primary); }
.iconbtn.spin svg { animation: spin 900ms linear infinite; }
/* 图标按钮有 40px 的状态层，图标本身要跟内容边缘对齐就得往右借 8px */
.topbar > .iconbtn:last-child { margin-right: -8px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ============================ 胶囊 ============================ */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 26px;
  padding: 0 10px;
  border-radius: var(--shape-full);
  background: var(--bg-inset);
  color: var(--md-sys-color-on-surface-variant);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .3px;
  white-space: nowrap;
}
.chip .dot { width: 6px; height: 6px; border-radius: 99px; background: currentColor; flex: none; }
.chip.ok { background: color-mix(in srgb, var(--c-success) 16%, transparent); color: var(--c-success); }
.chip.warn { background: color-mix(in srgb, var(--c-warning) 18%, transparent); color: var(--c-warning); }
.chip.bad { background: color-mix(in srgb, var(--c-danger) 18%, transparent); color: var(--c-danger); }
.chip.info { background: color-mix(in srgb, var(--c-info) 18%, transparent); color: var(--c-info); }
.chip.charge { background: color-mix(in srgb, var(--c-charge) 18%, transparent); color: var(--c-charge); }
/* 强调色高亮胶囊（车辆锁"已开锁"用）：和 ok/warn 那几档一个套路，颜色跟强调色走。
   浅色下是"淡紫块 + 紫字"，深色下是"深紫块 + 浅紫字"（primary 在深色主题里是 tone 80 的浅色档）。 */
.chip.accent { background: color-mix(in srgb, var(--md-sys-color-primary) 18%, transparent); color: var(--md-sys-color-primary); }
.chip.pulse .dot { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }

/* ============================ 卡片 ============================ */
/* 卡片：**不画描边、不投影**（无边框扁平化，2026-10-15 用户要求）。
   层次全靠 --bg-surface 与 --bg-page 的色差——扁平设计没有第二条退路：
   卡片底色一旦被改成和页面同一个值，整张卡就糊进页面里了。 */
.card {
  position: relative;
  padding: 14px 16px;
  border-radius: 18px;
  background: var(--bg-surface);
}

.card-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.card-title { font-size: 15px; font-weight: 600; letter-spacing: .1px; }
.card-sub { font-size: 12px; color: var(--md-sys-color-on-surface-variant); }
.card-head .iconbtn { margin: -8px -8px -8px 0; width: 34px; height: 34px; }
/* 卡头右侧动作区：必须是 flex——.iconbtn 是 display:grid（块级），
   直接塞进普通 div 里两个按钮会竖着堆，卡头就高出一倍（位置卡的眼睛+导航踩过） */
.card-head .card-actions { margin-left: auto; display: flex; align-items: center; gap: 2px; }

.section-title {
  display: flex; align-items: center; gap: 8px;
  margin: 4px 0 0;                /* 加上 .page 的 gap，视觉上距上一块 16px */
  font-size: 12.5px; font-weight: 600; letter-spacing: .4px;
  color: var(--md-sys-color-on-surface-variant);
}
.section-title .line { flex: 1; }   /* 以前是一条细线，现在只当"把右侧内容推到最右"的占位 */

/* ============================ 首屏车辆区 ============================ */
/* 车图、电量、续航、进度条收在一张卡里，两个大数字压在车图左右两侧：
   比"车图一行 + 数字一行 + 进度条一行 + meta 一行"省掉三行，
   而且所有文字都落在卡片的 16px 内边距上，不再往页面边上飘。 */
.hero-card { padding: 12px 16px 14px; }

.hero-top { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.hero-top .spacer { flex: 1 1 0; min-width: 0; }

.hero-stage {
  position: relative;
  /* 自成层叠上下文：车图、大数字、胎压气泡的 z-index 只在本区内部比较，
     不会漏到根层叠上下文去跟顶栏/底栏抢层级（气泡曾因此盖住顶栏文字） */
  isolation: isolate;
  height: 148px;
  display: grid;
  place-items: center;
  margin: 2px 0;
}
.hero-stage::before {             /* 展台光晕：把透明底车图从背景里托出来 */
  content: "";
  position: absolute;
  left: 50%; top: 48%;
  width: 108%; aspect-ratio: 1.9;
  transform: translate(-50%, -50%);
  background: radial-gradient(closest-side, var(--glow), transparent 72%);
  filter: blur(6px);
  pointer-events: none;
}
.hero-stage img, .hero-stage svg.fallback {
  position: relative;
  z-index: 1;
  max-width: 70%;
  max-height: 100%;
  object-fit: contain;
}
/* 车图入场动画：只有首屏那次渲染的元素带 .hero-in，之后的重渲染（切 tab、每 30 秒轮询）
   都不带——因为"元素摘下来再插回去"会让 CSS 动画重新开始，切一下 tab 就是"车图动两次"（用户报的）。
   类挂在元素上，后续渲染出来的新元素没有这个类，自然不会再播。 */
.hero-stage .hero-in {
  animation: heroIn var(--dur-long) var(--ease-decel) both;
}
@keyframes heroIn { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }

.bignum {
  position: absolute; top: 44%; transform: translateY(-50%);
  z-index: 2;
  display: flex; align-items: baseline; gap: 2px;
}
.bignum.left { left: 0; }
.bignum.right { right: 0; }
.bignum b { font-size: 34px; line-height: 36px; font-weight: 600; letter-spacing: -1.2px; }
.bignum i { font-style: normal; font-size: 13px; font-weight: 600; opacity: .6; margin-left: 2px; letter-spacing: 0; }

/* 电压（英雄位右上角）：点一下收起来、再点一下放出来，收起时原地留一个小圆点
   （圆点就是"这里还能点"的提示，也是热区）。
   数字和圆点是同时反向过渡的：数字往右缩着淡出 + 一点模糊，圆点在同一处放大淡入。 */
.bignum.volt {
  cursor: pointer;
  padding: 6px 2px;          /* 热区做大一点 */
  margin: -6px -2px;         /* 负外边距抵消掉 padding：数字的视觉位置一点都不动 */
}
.bignum.volt::after { content: ""; position: absolute; inset: -10px -12px; }   /* 透明外扩热区，手指好按 */
.bignum.volt .vnum { transition: opacity 220ms var(--ease-standard), transform 220ms var(--ease-decel), filter 220ms var(--ease-standard); }
.bignum.volt .vdot {
  position: absolute; right: 1px; top: 50%;
  width: 9px; height: 9px; border-radius: 99px;
  background: var(--md-sys-color-outline);
  opacity: 0; transform: translateY(-50%) scale(.3);
  transition: opacity 220ms var(--ease-standard), transform 280ms var(--ease-decel);
}
.bignum.volt.hide .vnum { opacity: 0; transform: translateX(6px) scale(.9); filter: blur(3px); }
.bignum.volt.hide .vdot { opacity: 1; transform: translateY(-50%) scale(1); }

/* 胎压气球：挂在车图前/后轮外侧，单行「2.3 bar 24°」；位置即轮位，所以不写「前轮/后轮」 */
.tirebub {
  position: absolute;
  z-index: 3;
  display: flex; align-items: baseline; gap: 3px;
  padding: 4px 9px 5px;
  border-radius: 11px;
  background: color-mix(in srgb, var(--bg-inset) 92%, transparent);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  pointer-events: none;
  white-space: nowrap;
}
.tirebub.left { left: 0; bottom: 4%; }
.tirebub.right { right: 0; bottom: 4%; }
.tirebub .pv { font-size: 15px; font-weight: 600; letter-spacing: -.3px; }
.tirebub .pu { font-size: 9px; font-weight: 500; opacity: .6; }
.tirebub .pt { font-size: 10px; color: var(--md-sys-color-on-surface-variant); margin-left: 1px; }
.tirebub.ok .pv { color: var(--c-success); }
.tirebub.warn .pv { color: var(--c-warning); }
.tirebub.bad .pv { color: var(--c-danger); }
/* 异常档（<1.9 黄 / <1.5 红）连气球底也染一层：车图上那行小字太小，只染数字不够扎眼。
   做法是「半透明色叠在原来的模糊底上」（两层背景）而不是换 background-color——
   底仍然是透的，玻璃质感不丢；正常档不染（正常就该安静）。 */
.tirebub.warn { background: linear-gradient(color-mix(in srgb, var(--c-warning) 20%, transparent), color-mix(in srgb, var(--c-warning) 20%, transparent)), color-mix(in srgb, var(--bg-inset) 92%, transparent); }
.tirebub.bad { background: linear-gradient(color-mix(in srgb, var(--c-danger) 22%, transparent), color-mix(in srgb, var(--c-danger) 22%, transparent)), color-mix(in srgb, var(--bg-inset) 92%, transparent); }
/* 气球入场：从**轮位**长出来——缩放原点是下沿中间（气球正对着轮子），先缩小藏在轮子里再弹出来。
   类由 viewHome() 按"这台车第一次拿到胎压"决定，轮询重绘不重播；后轮晚 100ms，两台轮一前一后。 */
@keyframes tirePop {
  0% { opacity: 0; transform: scale(.3) translateY(9px); }
  62% { opacity: 1; transform: scale(1.06) translateY(-1px); }
  100% { opacity: 1; transform: none; }
}
.tirebub.in { animation: tirePop .56s var(--ease-decel) both; transform-origin: 50% 100%; }
.tirebub.in.right { animation-delay: .1s; }

.hero-meta {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin-top: 9px;
  font-size: 11.5px; color: var(--md-sys-color-on-surface-variant);
}
.hero-meta .sep { width: 3px; height: 3px; border-radius: 99px; background: currentColor; opacity: .5; }

/* 高密度小格：一格 = 标签 + 数值 + 小字说明 */
.tile { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile .k { font-size: 10.5px; color: var(--md-sys-color-on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v { font-size: 17px; font-weight: 600; letter-spacing: -.3px; white-space: nowrap; }
.tile .v small { font-size: 10px; font-weight: 500; opacity: .65; margin-left: 2px; letter-spacing: 0; }
.tile .s { font-size: 10.5px; color: var(--md-sys-color-on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.bar {
  position: relative;
  height: 6px;
  margin: 10px 0 0;
  border-radius: 99px;
  background: color-mix(in srgb, var(--md-sys-color-on-surface) 10%, transparent);
  overflow: hidden;
}
.bar > i {
  position: absolute; inset: 0 auto 0 0;
  border-radius: 99px;
  background: linear-gradient(90deg, color-mix(in srgb, var(--bar-c, var(--c-success)) 70%, #fff 0%), var(--bar-c, var(--c-success)));
  transition: width var(--dur-long) var(--ease-decel);
}
.bar.charging > i { background-image: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.55) 50%, transparent 100%), linear-gradient(90deg, var(--bar-c), var(--bar-c)); background-size: 40% 100%, 100% 100%; background-repeat: no-repeat; animation: flow 1.8s linear infinite; }

/* 电池条入场：进爱车页那次从 0 长到 --bar-w（只有那次挂 .grow，见 app.js viewHome）。
   **为什么是 animation 而不是靠上面那条 transition**：这个元素是这一帧刚由 innerHTML 建出来的，
   它的"起始宽度"从没被计算过，连着改两次 style 会被合并成一次——浏览器看到的就是"直接是 83%"、
   过渡根本不起（实测过：手动改 0% → 强制回流 → 改回来，宽度纹丝不动）。keyframes 没有这个时序竞争。
   charging 的流光要单独再列一次：两个规则同元素，animation 简写谁在后面谁说了算。 */
@keyframes barGrow { from { width: 0; } to { width: var(--bar-w, 0%); } }
.bar.grow > i { animation: barGrow var(--dur-long) var(--ease-decel) both; }
.bar.grow.charging > i { animation: barGrow var(--dur-long) var(--ease-decel) both, flow 1.8s linear infinite; }
@keyframes flow { from { background-position: -60% 0, 0 0; } to { background-position: 160% 0, 0 0; } }

.hero-meta {
  display: flex; align-items: center; gap: 10px;
  margin: 14px 4px 0;
  font-size: 12px; color: var(--md-sys-color-on-surface-variant);
}
.hero-meta .sep { width: 3px; height: 3px; border-radius: 99px; background: currentColor; opacity: .5; }

/* ============================ 快捷操作 ============================ */
/* 这一排是按钮（比卡片亮一级的 surface-container），和下面的卡片有明确的层级差，
   加上 .page 的 gap，不会再和「车辆位置」糊成一块。 */
.actions {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.action {
  position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  /* 图标与文字的间距 5px：**不是随手调的**——长按进度环比图标大 10px（上下各 5px），
     间距 3px 时环的下缘会切进文字 2px（用户 2026-10-16 报"环和图案对不齐"的同一次调整）。
     按钮高度由 min-height 兜着，这里加 2px 不会把这一排撑高。 */
  gap: 5px;
  min-height: 64px;
  padding: 7px 4px;
  /* 底色比页面亮一级（surface-container），靠色差成块——不画描边。
     ⚠️ `border: 0` 必须有：其它按钮都有这条重置，这里以前靠显式 border 盖着 UA 样式，
     一旦去掉 border 就会露出浏览器默认的 button 边框（DOM 遍历检查会看到 1.6px，肉眼像一圈毛边）。 */
  border: 0;
  border-radius: 14px;
  background: var(--bg-surface);
  color: var(--md-sys-color-on-surface);
  font: inherit; font-size: 11.5px;
  cursor: pointer;
  transition: transform var(--dur-short) var(--ease-standard), background var(--dur-short) var(--ease-standard);
}
.action:active { transform: scale(.955); }
.action .ico { width: 26px; height: 26px; display: grid; place-items: center; border-radius: var(--shape-full); background: color-mix(in srgb, var(--md-sys-color-primary) 12%, transparent); color: var(--md-sys-color-primary); }
.action.on .ico { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }
.action .lbl { font-weight: 500; }
.action .st { font-size: 10px; color: var(--md-sys-color-on-surface-variant); }
.action[disabled] { opacity: .45; pointer-events: none; }
.action.busy .ico svg { animation: spin 900ms linear infinite; }

/* ============================ 数据小格 ============================ */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid2 > .card + .card { margin-top: 0; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 8px; }

/* 位置卡 + 骑行卡并排（各占一半宽）。共享车没有骑行卡，位置卡整行、内部再排成一行。
   半宽卡的高度要压住：卡头、地图、小格行高都比整宽卡紧一档，否则两张卡吃掉半屏。 */
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
.duo > .card { min-width: 0; padding: 11px 12px 9px; }
.duo .card-title { font-size: 14px; }
.duo .card-sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.duo .card-head { gap: 4px; margin-bottom: 8px; }
.duo .card-head .iconbtn { width: 30px; height: 30px; margin: -6px -6px -6px 0; }
.duo .mapbox.sm { height: 96px; }
.duo .kv { gap: 6px; padding: 6px 0; }
.duo .kv .k, .duo .kv .v { font-size: 12px; }
.duo .grid2 { gap: 6px 8px; }
.duo .tile { gap: 1px; }
.duo .tile .k { font-size: 10px; line-height: 1.2; }
.duo .tile .v { font-size: 14px; line-height: 1.15; }
.duo .tile .v small { font-size: 9px; }
.duo .bars { height: 58px; gap: 6px; }
.duo .bars .b span { font-size: 10px; }
.duo .card-sub.mt8 { display: none; }   /* 半宽下"最近 7 天里程"那行提示太挤，藏掉 */

/* 位置卡的"更新时间 · 海拔"一行小字 */
.loc-meta {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  margin-top: 8px;
  font-size: 11px; color: var(--md-sys-color-on-surface-variant);
  white-space: nowrap;
}
.loc-meta-col { display: flex; flex-direction: column; gap: 10px; }
.loc-meta-col > div { display: flex; flex-direction: column; gap: 2px; }
.loc-meta-col span { font-size: 11px; color: var(--md-sys-color-on-surface-variant); }
.loc-meta-col b { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
/* 坐标那行比时间/海拔长，字号收一点、用等宽，免得右列被撑开或折行 */
.loc-meta-col .wide b { font-size: 12px; font-weight: 500; }

/* 共享车：位置卡整行，地图和信息并排 */
.loc-row { display: grid; grid-template-columns: 42% 1fr; gap: 12px; align-items: start; }
.loc-row .mapbox { height: 116px; }
.loc-row .kv:first-child { padding-top: 0; }
.loc-row .kv:last-child { padding-bottom: 0; }

/* min-width:0 是网格里必须的：.stat 是 .grid3 的网格项，它的自动最小尺寸会按内容的
   min-content 走——值一旦 nowrap（[data-fit] 那种长文本），min-content 就是整串文字的宽度，
   轨道会**被撑宽**（三列 105px 变 117px，整行溢出卡片）。归零后轨道才是真的 1fr，
   值溢出到盒外，fitText() 才有"溢出"可量、才能把字号缩下来。 */
.stat { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat .k { font-size: 11px; color: var(--md-sys-color-on-surface-variant); }
.stat .v { font-size: 19px; font-weight: 600; letter-spacing: -.2px; }
.stat .v small { font-size: 11px; font-weight: 500; opacity: .7; margin-left: 2px; }
/* 数值分档色（电量 <30 黄 / <20 红，档位由 MODEL.socLevel 给）：只染数字，标签不动 */
.stat.warn .v { color: var(--c-warning); }
.stat.bad .v { color: var(--c-danger); }
/* 自适应字号的值（js/ui.js fitText）：先 nowrap 才有"溢出"可量，缩到下限还放不下就省略号，
   绝不折行（用户 2026-10-16：骑行时长不要换行）。 */
.stat .v[data-fit] { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.kv { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
.kv:last-child { padding-bottom: 0; }
.kv:first-child { padding-top: 0; }
/* 开关也要靠右：.kv 里只有 .v 写了 margin-left:auto，开关没有，会紧跟在文字后面 */
.kv > .switch { margin-left: auto; }

/* ============================ 胎压警戒区间 ============================ */
/* 色带配方（浅深两色都用语义槽位，不写死颜色）：
   红 = 车机红线之外（<1.5 / >3.0）；黄 = 出了用户设的区间；绿 = 用户区间内。
   迷你版（设置行里）量程就是红线之间，所以底下那层黄一定铺满、只看得见绿；
   控件版把轨道做得比滑块行程宽出"半个滑块"，两端露出来的红就是"红线之外"。 */
.band { position: relative; display: block; height: 8px; border-radius: 99px; overflow: hidden; background: var(--c-warning); }
.band i { position: absolute; top: 0; bottom: 0; border-radius: 99px; }
.band i.ok { background: var(--c-success); }
.band.mini { width: 46px; height: 6px; flex: none; }
.band-cell { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; }
/* 设置行里的"前/后各一条"：两行竖排、靠右（别把标题挤没） */
.band-cell.col { flex-direction: column; align-items: flex-end; gap: 3px; }
.band-cell .band-line { display: inline-flex; align-items: center; gap: 6px; }
.band-cell .band-line i { font-style: normal; font-size: 11px; color: var(--md-sys-color-on-surface-variant); }
.band-cell .band-line b { font-size: 12.5px; font-weight: 600; letter-spacing: -.2px; }
/* 弹层里前后两套之间只靠间距分区（扁平设计不加分隔线） */
.band-sec + .band-sec { margin-top: 20px; }
.band-sec-head { font-size: 13px; font-weight: 600; }

/* 双滑块区间控件：两个 native range 叠在一起（只让滑块接收事件、轨道不挡），
   靠 JS 在 pointerdown 时把离手指近的那个抬到上面。轨道/色带都在滑块下面当背景。 */
.dual { position: relative; height: 40px; margin: 6px 0 0; }
.dual .track, .dual .inner { position: absolute; top: 50%; height: 8px; transform: translateY(-50%); border-radius: 99px; }
.dual .track { left: 0; right: 0; background: var(--c-danger); }        /* 全宽：两端那 9px 就是"红线之外" */
.dual .inner { left: 9px; right: 9px; background: var(--c-warning); overflow: hidden; }  /* 9px = 半个滑块 */
.dual .band { position: absolute; top: 0; bottom: 0; background: var(--c-success); }     /* 由 JS 定 left/width */
.dual input[type="range"] {
  position: absolute; left: 0; top: 0; width: 100%; height: 100%; margin: 0;
  background: transparent; border: 0; appearance: none; -webkit-appearance: none;
  pointer-events: none;                 /* 轨道不接事件，只有滑块接 */
  z-index: 2;
}
.dual input[type="range"]::-webkit-slider-runnable-track { height: 100%; background: transparent; }
.dual input[type="range"]::-webkit-slider-thumb {
  appearance: none; -webkit-appearance: none;
  pointer-events: auto;                 /* 滑块本身要能拖 */
  width: 18px; height: 18px; border: 0; border-radius: 99px;
  background: var(--md-sys-color-primary);
  /* 扁平设计里把滑块从彩色带上"抠"出来：用**实色环**（跟 --ring-page 一个套路），不是投影 */
  box-shadow: 0 0 0 3px var(--bg-surface);
}
.dual input[type="range"]::-moz-range-track { height: 100%; background: transparent; }
.dual input[type="range"]::-moz-range-thumb {
  pointer-events: auto; width: 18px; height: 18px; border: 0; border-radius: 99px;
  background: var(--md-sys-color-primary); box-shadow: 0 0 0 3px var(--bg-surface);
}
.dual-read { display: flex; justify-content: space-between; margin-top: 4px; font-size: 12px; color: var(--md-sys-color-on-surface-variant); }
.dual-read b { color: var(--md-sys-color-on-surface); font-size: 15px; font-weight: 600; }

/* 左右两列的分工（2026-10-15 两轮实测才定下来，改之前先看这段）：
   · 标题列 flex:1 1 auto + min-width:0 —— 拿剩余宽度，长标题自己换行，绝不把值挤没；
   · 值列 flex:0 0 auto（**不许收缩**）+ max-width:70% + 省略号 —— 短值原样显示，
     超长值（车机偶尔报一整段 JSON）封顶到 70% 用省略号收尾，完整值压在 title 上。
   两种写法都试过：只给值列 max-width（值列会被标题列挤到 15px，"档位 2"都显示不全）；
   只给标题列 flex:1（标题列贪掉整行 → 值列被压扁）。缺一不可。 */
.kv .k { font-size: 13px; color: var(--md-sys-color-on-surface-variant); min-width: 0; flex: 1 1 auto; }
.kv .v {
  margin-left: auto; font-size: 13px; font-weight: 500; text-align: right; white-space: nowrap;
  flex: 0 0 auto; max-width: 70%; overflow: hidden; text-overflow: ellipsis;
}
.kv .v.mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 12px; }
/* 值本来就长、又不想被省略号吃掉的行（如「VIN … · UID …」）：标题一行、值换行占满 */
.kv.stack { display: block; }
.kv.stack .k { display: block; }
.kv.stack .v {
  display: block; max-width: none; margin: 4px 0 0; text-align: left;
  white-space: normal; overflow: visible; text-overflow: clip; overflow-wrap: anywhere;
}
.kv .raw {
  font-size: 10px; color: var(--md-sys-color-on-surface-variant); opacity: .7;
  display: block; font-family: ui-monospace, Consolas, monospace;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* 设置行的标题与说明（说明 = 官方 description，中文正文，不是等宽小字） */
.kv .kt { color: var(--md-sys-color-on-surface); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.kv .desc { display: block; margin-top: 2px; font-size: 11px; line-height: 1.45; color: var(--md-sys-color-on-surface-variant); }
/* 灰显行（仅蓝牙 / 未适配）：标题也调暗，跟能写的行区分开 */
.kv.off .kt { color: var(--md-sys-color-on-surface-variant); }
.kv.off .desc { opacity: .85; }
.kv .kt .chip { font-size: 10px; padding: 1px 6px; }
.kv.kv-act { cursor: pointer; }

/* ============================ 设置页：可折叠分组 ============================ */
/* 分组卡整张不留内边距，头部自己撑满——这样点哪儿都能展开，热区够大 */
.card.group-card { padding: 0; overflow: hidden; }
.group-head {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 13px 14px;
  border: 0; background: transparent; color: inherit; font: inherit;
  text-align: left; cursor: pointer;
  transition: background var(--dur-short) var(--ease-standard);
}
.group-head .gi {
  flex: none; width: 30px; height: 30px; display: grid; place-items: center;
  border-radius: 9px;
  background: var(--bg-inset);
  color: var(--md-sys-color-on-surface-variant);
}
.group-head .gt { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; letter-spacing: .1px; }
.group-head .gc {
  flex: none; font-size: 11px; font-weight: 600;
  color: var(--md-sys-color-on-surface-variant);
  background: color-mix(in srgb, var(--md-sys-color-on-surface) 8%, transparent);
  padding: 2px 7px; border-radius: 99px;
}
.group-head .gv {
  flex: none; display: grid; place-items: center;
  color: var(--md-sys-color-on-surface-variant);
  transition: transform var(--dur-med) var(--ease-standard);
}
.group-head.open .gv { transform: rotate(180deg); }
.group-body { padding: 2px 14px 10px; }
/* 设置项行整行可点：没有分隔线之后要多给点纵向空间——既透气，也把热区撑到 ~44px */
.group-body .kv { padding: 12px 0; }

/* 柱状图 */
.bars { display: flex; align-items: flex-end; gap: 5px; height: 56px; margin-top: 2px; }
.bars .b { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.bars .b > i { width: 100%; border-radius: 6px 6px 3px 3px; background: color-mix(in srgb, var(--md-sys-color-primary) 75%, transparent); min-height: 3px; transition: height var(--dur-med) var(--ease-decel); }
.bars .b.today > i { background: var(--md-sys-color-primary); }
.bars .b span { font-size: 9px; color: var(--md-sys-color-on-surface-variant); }

/* 胎压 */

/* 地图 */
.mapbox {
  position: relative;
  height: 134px;
  border-radius: var(--shape-l);
  overflow: hidden;
  background: var(--bg-inset);
}
/* 骑行轨迹用：轨迹是竖着的，扁框装不下会被上下裁掉 */
.mapbox.tall { height: 240px; }
/* 两栏里的位置图：只有半格宽，高度也收一半，不然整张卡被地图撑高 */
.mapbox.sm { height: 96px; }
.mapbox.sm .unmask { font-size: 10.5px; gap: 4px; }
.mapbox.sm .unmask .ico svg { width: 16px; height: 16px; }

/* 首页位置卡：默认不显示位置（连瓦片都不请求），点眼睛才出来 */
.mapbox.hidden-loc {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;
  background: var(--bg-inset);
  color: var(--md-sys-color-on-surface-variant);
  font-size: 12px; font-weight: 600;
}

/* 大地图（弹层里）：多点标记 */
.mapbox.big { height: 420px; cursor: default; }
.mapbox .mk {
  position: absolute; left: 50%; top: 50%; z-index: 2;
  border-radius: 99px; display: grid; place-items: center;
}
.mapbox .mk.car {
  width: 18px; height: 18px;
  background: var(--md-sys-color-primary);
  box-shadow: 0 0 0 5px color-mix(in srgb, var(--md-sys-color-primary) 26%, transparent);   /* 只有色环 */
}
.mapbox .mk.me {
  width: 16px; height: 16px;
  background: #2f80ed;
  box-shadow: 0 0 0 5px rgba(47, 128, 237, .24);   /* 只有色环 */
}
.mapbox .mk .mkl {
  position: absolute; bottom: 150%; left: 50%; transform: translateX(-50%);
  white-space: nowrap; font-size: 10px; font-weight: 600;
  padding: 2px 6px; border-radius: 6px;
  background: color-mix(in srgb, var(--bg-surface) 96%, transparent);
  color: var(--md-sys-color-on-surface);
}
.mapbox .tiles { position: absolute; inset: 0; filter: var(--map-filter); }
.mapbox .tiles img { position: absolute; width: 256px; height: 256px; user-select: none; }
.mapbox .pin {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -100%);
  color: var(--md-sys-color-primary);
  transition: opacity var(--dur-med) var(--ease-standard);
}
.mapbox .mapload { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; color: var(--md-sys-color-on-surface-variant); }

/* 位置默认打码：瓦片模糊 + 精确坐标用文字盖住，点地图（或卡头那只眼睛）才揭开。
   模糊只作用在瓦片层，署名和遮罩文字保持清晰。 */
.mapbox { cursor: pointer; }
.mapbox.masked .tiles { filter: blur(16px) saturate(.75) var(--map-filter); transform: scale(1.08); }
.mapbox.masked .pin { opacity: 0; }
.mapbox.masked .track { filter: blur(9px); opacity: .5; }
.mapbox .track { transition: filter var(--dur-med) var(--ease-standard), opacity var(--dur-med) var(--ease-standard); }
.mapbox .tiles { transition: filter var(--dur-med) var(--ease-standard), transform var(--dur-med) var(--ease-standard); }
.mapbox .unmask {
  position: absolute; inset: 0; z-index: 3;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;
  border: 0; padding: 0;
  background: color-mix(in srgb, var(--bg-page) 45%, transparent);
  color: var(--md-sys-color-on-surface);
  font: inherit; font-size: 12px; font-weight: 600; letter-spacing: .2px;
  cursor: pointer;
}
.mapbox .unmask .ico {
  display: grid; place-items: center;
  width: 36px; height: 36px; border-radius: var(--shape-full);
  background: var(--bg-inset);
}
.mapbox .unmask span { text-shadow: 0 1px 2px rgba(0, 0, 0, .25); }

/* 骨架屏 */
.sk { position: relative; overflow: hidden; background: color-mix(in srgb, var(--md-sys-color-on-surface) 8%, transparent); border-radius: var(--shape-s); }
.sk::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--md-sys-color-on-surface) 8%, transparent), transparent); animation: shimmer 1.4s infinite; }
@keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

/* ============================ 按钮 ============================ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; padding: 0 20px;
  border: 0; border-radius: var(--shape-full);
  background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary);
  font: inherit; font-size: 14px; font-weight: 600;
  cursor: pointer;
  transition: transform var(--dur-short) var(--ease-standard);
}
.btn:active { transform: scale(.97); }
.btn.tonal { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }
.btn.text { background: transparent; color: var(--md-sys-color-primary); padding: 0 12px; }
.btn.block { width: 100%; }
.btn.sm { height: 34px; padding: 0 14px; font-size: 13px; }
/* 禁用的按钮必须有区别：没有这条时 disabled 的主色按钮看着跟可点的一模一样
   （任务面板的「一键完成」列表没读到时是禁用的，但看起来亮着）。
   用 M3 的禁用配方（灰底 + 灰字），别用透明度——半透明的主色看着像"被洗白的绿"，不像禁用。 */
.btn[disabled] {
  pointer-events: none;
  background: color-mix(in srgb, var(--md-sys-color-on-surface) 12%, transparent);
  color: color-mix(in srgb, var(--md-sys-color-on-surface) 38%, transparent);
}

/* ============================ 底部 tab ============================ */
/* iOS 式玻璃底栏：离底边留一条缝、大圆角、底色很透，材质感靠 backdrop-filter 的**模糊 + 高饱和**
   （iOS 的玻璃就是这个配方），不靠底色。-webkit- 那份是给 iOS Safari 的（少它就只有半透明没有模糊）。
   ⚠️ 这里的 1px 描边是**用户点名要的**（"底栏需要加边框"，2026-10-15）——全站"无边框扁平化"里
   唯一的例外，别按统一规则删掉：玻璃材质没有边就糊进页面里了。边框色跟 on-surface 走，
   浅色下是浅灰边（在灰页面上勾出轮廓），深色下变成亮边（像玻璃的反光）。 */
.tabbar {
  position: absolute; left: 12px; right: 12px; bottom: calc(var(--tabbar-inset) + var(--sab));
  z-index: 7;
  display: flex;
  gap: 4px;
  padding: 6px;
  border-radius: 34px;
  background: color-mix(in srgb, var(--bg-surface) 26%, transparent);
  border: 1px solid color-mix(in srgb, var(--md-sys-color-on-surface) 14%, transparent);
  backdrop-filter: blur(32px) saturate(180%);
  -webkit-backdrop-filter: blur(32px) saturate(180%);
}
.tab {
  flex: 1;
  /* position/z-index：让按钮压在选中态滑块（.tab-ind）上面——绝对定位元素默认画在普通内容之上，
     不抬这一层的话药丸会盖住图案和文字 */
  position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  /* 选中态是**整块**的：内边距留在按钮上，选中时图案 + 文字一起被药丸包住（以前只包图案） */
  padding: 8px 10px;
  border: 0; border-radius: var(--shape-full);
  background: transparent; color: var(--md-sys-color-on-surface-variant);
  font: inherit; font-size: 11px; font-weight: 600;
  cursor: pointer;
  transition: background var(--dur-med) var(--ease-standard), color var(--dur-med) var(--ease-standard);
}
.tab .pill { display: grid; place-items: center; }
/* 选中态 = **一颗独立的滑块**（.tab-ind），切页时横向滑到新位置（用户 2026-10-16 要的
   "底栏横向移动变化的过渡动画"）。以前选中态是按钮自己的背景色，只能硬切。
   - 滑块排在按钮前面且绝对定位：不占 flex 位置（否则会把三个 tab 挤歪）；
   - 按钮 z-index:1 压在滑块上（绝对定位元素默认画在普通内容之上，不给 z-index 的话药丸会盖住图案和文字）；
   - 宽度也跟着过渡：三个 tab 的文字长短不同（爱车 / 车辆设置 / 我的），滑过去时宽度一起伸缩；
   - 定位由 app.js placeTabInd() 按按钮的 offset* 写进来，镜像/缩放时不能播动画（那时加 .noanim）。 */
.tab-ind {
  position: absolute; left: 0; top: 0;
  border-radius: var(--shape-full);
  background: var(--tab-sel-bg);
  opacity: 0;
  transition: transform var(--dur-med) var(--ease-standard), width var(--dur-med) var(--ease-standard),
              height var(--dur-med) var(--ease-standard), opacity var(--dur-short) var(--ease-standard);
}
.tab-ind.noanim { transition: none; }
.tab.sel { color: var(--tab-sel-fg); }

/* ==================== 会员（整张金卡 · js/app.js svipTop/svipSheet） ==================== */
/* 会员有效时**整张「用户属性」卡就是金卡**（用户 2026-10-16 三轮要求收敛到这一点：
   ① "跟用户属性融合、别单开一张"；② "为什么把一个卡片拆成两个半卡片" ⇒ 不要再做"金卡头 + 白下半截"的拼法；
   ③ "背景不符合扁平化设计，最好是纯色，图案可以保留" ⇒ 底色是**纯色**（--svip-bg），
   渐变与扫光都删了，只留王冠水印这一层图案。
   依旧是全站规则：不加阴影、不加细线；深度只靠色阶/间距/色环。 */
.card.member {
  overflow: hidden;                     /* 王冠水印要跟着卡片的圆角裁 */
  background: var(--svip-bg);
  color: var(--svip-ink);
}
/* 卡里的东西原本都吃主题色（灰标签、紫按钮、灰副标题），金底上逐样换金色系 */
.card.member .idrow { margin-top: 12px; }
.card.member .idrow-avatar { background: var(--svip-avatar-bg); color: var(--svip-ink); }
.card.member .idrow-sub { color: var(--svip-ink-soft); }
.card.member .stat .k { color: var(--svip-ink-soft); }
.card.member .stat .v { color: var(--svip-ink); }
.card.member .btn.tonal { background: var(--svip-badge-bg); color: var(--svip-ink); }
/* 王冠水印：压在右下角、只留一点痕迹（吃 currentColor，深浅两套色自动跟着走）。
   纯色底上它更清楚，所以透明度压到 .1，别抢正文的注意力。 */
.svip-crown { position: absolute; right: -16px; bottom: -28px; opacity: .1; transform: rotate(-10deg); pointer-events: none; }
/* 徽章行：卡里唯一"可点开会员详情"的入口（整卡可点的话，点统计数字也会弹层）。
   有效期并到这颗徽章的右端（用户 2026-10-16：别单独占一行，"少一行更整洁"）——
   所以 `.svip-left` 现在装的是「剩 N 天 · 到期日」，nowrap 保证它不折行。 */
.svip-top { display: flex; align-items: center; gap: 8px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.svip-badge {
  display: inline-flex; align-items: center; gap: 5px;
  height: 24px; padding: 0 9px;
  border-radius: var(--shape-full);
  background: var(--svip-badge-bg);
  font-size: 11.5px; font-weight: 700; letter-spacing: 1.2px;
}
.svip-left { margin-left: auto; font-size: 11.5px; font-weight: 600; opacity: .85; white-space: nowrap; }
/* 会员详情弹层里的那一小块独立金卡（弹层里没有外层卡片可融合，得自己带圆角） */
.svip-panel {
  position: relative; overflow: hidden;
  padding: 14px 16px 14px;
  border-radius: 18px;
  background: var(--svip-bg);
  color: var(--svip-ink);
}
.svip-name { margin-top: 12px; font-size: 17px; font-weight: 700; letter-spacing: .2px; line-height: 1.35; }
.svip-sub {
  margin-top: 3px; font-size: 12px; color: var(--svip-ink-soft); line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

/* 头像行（会员卡与普通卡共用同一份 DOM，只有底色不同） */
.idrow { display: flex; align-items: center; gap: 14px; }
.idrow-avatar {
  position: relative; flex: none;
  width: 56px; height: 56px; border-radius: 999px; overflow: hidden;
  display: grid; place-items: center;
  background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container);
}
.idrow-avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.idrow-main { min-width: 0; }
.idrow-nick { font-size: 17px; font-weight: 600; line-height: 1.35; }
.idrow-sub {
  margin-top: 2px;
  font-size: 12px; color: var(--md-sys-color-on-surface-variant); line-height: 1.4;
  /* 签名可能写得很长：两行封顶，别把卡片撑成一块砖 */
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.idrow-tasks { margin-left: auto; flex: none; }

/* ============================ 骑行记录（弹层里） ============================ */
.monthbar {
  position: relative;                 /* 刷新按钮绝对定位在右端：不参与 flex，月份标签才能保持居中 */
  display: flex; align-items: center; gap: 4px;
  padding: 2px 0 10px;
}
.monthbar .monthlabel {
  flex: 1; text-align: center;
  font-size: 15px; font-weight: 600; letter-spacing: .2px;
}
.monthbar .iconbtn.refresh { position: absolute; right: 0; top: 0; }
.monthbar .iconbtn[disabled] { opacity: .3; pointer-events: none; }

.mstats {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  padding: 12px;
  border-radius: var(--shape-l);
  background: var(--bg-inset);
  margin-bottom: 10px;
}

.rec-row {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 0;
  cursor: pointer;
}
.rec-row.zero { opacity: .5; }
.rec-row .d { display: flex; flex-direction: column; width: 62px; flex: none; }
.rec-row .d b { font-size: 14px; font-weight: 600; }
.rec-row .d span { font-size: 10.5px; color: var(--md-sys-color-on-surface-variant); }
.rec-row .m { flex: 1; min-width: 0; font-size: 13px; }
.rec-row .m b { font-size: 15px; font-weight: 600; }
.rec-row .m span { color: var(--md-sys-color-on-surface-variant); font-size: 11px; }
.rec-row .tail { color: var(--md-sys-color-on-surface-variant); display: flex; align-items: center; }

/* 行程行：左列是"16:12–16:22"这种时间区间，比日期长，套 .rec-row 的 62px 会折成三行 */
.trip-row {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 0;
  cursor: pointer;
}
.trip-row .tt {
  flex: none; font-size: 13.5px; font-weight: 600;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.trip-row .tm {
  flex: 1; min-width: 0; text-align: right;
  font-size: 12px; color: var(--md-sys-color-on-surface-variant);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.trip-row .tm b { font-size: 13.5px; font-weight: 600; color: var(--md-sys-color-on-surface); }
.trip-row .tail { flex: none; color: var(--md-sys-color-on-surface-variant); display: flex; align-items: center; }

.rec-back {
  display: inline-flex; align-items: center; gap: 4px;
  border: 0; background: transparent; color: var(--md-sys-color-primary);
  font: inherit; font-size: 13px; font-weight: 600; padding: 0; cursor: pointer;
}

/* ============================ 充电曲线（弹层里） ============================ */
/* 结论块：一句话（还要多久）+ 口径（按当前增速外推）。层次靠色阶，不用描边/阴影。 */
.chg-hero { padding: 14px; border-radius: var(--shape-l); background: var(--bg-inset); }
.chg-hero .big { font-size: 21px; font-weight: 700; letter-spacing: -.3px; }
.chg-hero .s { margin-top: 4px; font-size: 11.5px; line-height: 1.65; color: var(--md-sys-color-on-surface-variant); }

/* 指标切换：选中态用 .ok（跟骑行视图/地图模式那两处同一套 chips） */
.chg-metrics { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 8px; }
.chg-metrics .chip { cursor: pointer; }

/* 图：内嵌色阶块。--c-chg 由 JS 按指标给（电量=主色 / 功率=充电色 / 电压=绿 / 电流=琥珀 / 温度=红） */
.chg-chart { background: var(--bg-inset); border-radius: var(--shape-l); padding: 6px 2px 2px; }
.chg-svg { width: 100%; height: auto; display: block; }
.chg-svg text { font-size: 9px; fill: var(--md-sys-color-on-surface-variant); font-variant-numeric: tabular-nums; }
.chg-svg text.now { font-size: 10.5px; font-weight: 600; fill: var(--md-sys-color-on-surface); }
/* 参考线是数据墨（没有它就量不出"涨了多少"），压得很淡 */
.chg-svg line.g { stroke: var(--md-sys-color-outline-variant); stroke-width: 1; stroke-dasharray: 3 4; opacity: .6; }
.chg-svg .line { fill: none; stroke: var(--c-chg); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chg-svg .area { fill: color-mix(in srgb, var(--c-chg) 14%, transparent); stroke: none; }
.chg-svg .pt { fill: var(--bg-inset); stroke: var(--c-chg); stroke-width: 1.4; }
.chg-svg .dotEnd { fill: var(--c-chg); }
/* 外推那截：虚线 + 空心点——它是**算出来的**，跟实测那段必须看得出区别 */
.chg-svg .proj { fill: none; stroke: var(--c-chg); stroke-width: 1.6; stroke-dasharray: 4 4; opacity: .6; }
.chg-svg .ptProj { fill: var(--bg-inset); stroke: var(--c-chg); stroke-width: 1.6; opacity: .8; }
.chg-empty { padding: 26px 12px; text-align: center; font-size: 12px; color: var(--md-sys-color-on-surface-variant); }

/* ============================ 底部弹层 ============================ */
/* 关闭后必须交出指针事件：遮罩留在 DOM 里（只去 show 类），否则它会静默吃掉全屏点击 */
.scrim {
  position: absolute; inset: 0; z-index: 8;
  background: rgba(0, 0, 0, .45);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--dur-med) var(--ease-standard);
}
.scrim.show { opacity: 1; pointer-events: auto; }

/* 收起时必须 visibility:hidden：它 translateY 到框外会撑出滚动溢出，
   而 .phone 虽然是 overflow:hidden 但仍可被 scrollIntoView/焦点带着滚，那样顶栏会被顶出视口 */
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 9;
  max-height: 82%;
  display: flex; flex-direction: column;
  padding: 8px 0 calc(16px + var(--sab));
  border-radius: var(--shape-2xl) var(--shape-2xl) 0 0;
  background: var(--bg-surface);
  transform: translateY(101%);
  visibility: hidden;
  transition: transform var(--dur-med) var(--ease-decel), visibility 0s linear var(--dur-med);
}
.sheet.show {
  transform: none;
  visibility: visible;
  transition: transform var(--dur-med) var(--ease-decel);
}
.sheet .grab { width: 32px; height: 4px; margin: 0 auto 12px; border-radius: 99px; background: var(--md-sys-color-outline-variant); }
.sheet .sheet-head { display: flex; align-items: center; gap: 10px; padding: 0 20px 10px; }
.sheet .sheet-title { font-size: 17px; font-weight: 600; }
.sheet .sheet-body { padding: 0 20px; overflow-y: auto; overflow-x: hidden; }

/* 弹层里再翻一层（任务面板 → 任务设置）时，body 给个方向感的淡入淡出：
   面板本身不动（还在原位置），只换里面的内容——往前翻从右进、返回从左进。 */
@keyframes sheetSwapFwd { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }
@keyframes sheetSwapBack { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
.sheet.swap-fwd .sheet-body { animation: sheetSwapFwd var(--dur-short) var(--ease-decel) both; }
.sheet.swap-back .sheet-body { animation: sheetSwapBack var(--dur-short) var(--ease-decel) both; }

/* 全屏弹层：骑行记录这种内容多的，半屏装不下 */
.sheet.full {
  max-height: 100%;
  height: 100%;
  border-radius: 0;
  padding-top: calc(10px + var(--sat));
}
.sheet.full .grab { display: none; }
.sheet.full .sheet-head { padding-top: 4px; }
.sheet.full .sheet-body { padding-bottom: calc(16px + var(--sab)); }

/* 居中确认框（车控那种"一句要不要做"，用户 2026-10-16 要求居中、别贴底部）。
   内容面板仍走底部弹层——那是"翻内容"，这是"确认一下"。
   隐藏态用「缩小 + 淡出」而不是底部弹层的 translateY(101%)：居中的框从下方滑进来会很怪。
   ⚠️ visibility 的延迟过渡必须跟基础 .sheet 一致（display 之外的收起态靠它），别省。 */
.sheet.center {
  left: 50%; right: auto; bottom: auto; top: 50%;
  width: min(86%, 340px);
  max-height: 78%;
  padding: 18px 0 12px;
  border-radius: var(--shape-2xl);
  transform: translate(-50%, -50%) scale(.94);
  opacity: 0;
  transition: transform var(--dur-med) var(--ease-decel), opacity var(--dur-med) var(--ease-standard),
              visibility 0s linear var(--dur-med);
}
.sheet.center.show {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
  transition: transform var(--dur-med) var(--ease-decel), opacity var(--dur-med) var(--ease-standard);
}
/* 居中的框没有"往下抽"这个动作，把手柄去掉；标题/副标题在整框里居中（文本块占满宽度，
   X 绝对定位到右上角，不再挤占标题那一行的宽度）；body 的底部内边距是给底部弹层留的，这里收掉 */
.sheet.center .grab { display: none; }
.sheet.center .sheet-head { padding-bottom: 6px; }
.sheet.center .sheet-head > div { flex: 1; }
.sheet.center .sheet-head [data-close] { position: absolute; top: 8px; right: 8px; }
.sheet.center .sheet-body { padding-bottom: 4px; }

/* ============================ 贡献图（紧凑点阵） ============================ */
/* 固定 53 列 × 7 行，列宽 1fr 自适应容器（写死 px 会让 53 列超出屏幕被裁）。
   整块高度 = 7 行小格 + 月份标签 + 图例，约 70px。 */
.hm-grid { display: grid; gap: 1px; }
.hm .c {
  display: block; border-radius: 2px;
  /* l0 = 那天完全没出门：只留一丝轮廓，好跟"骑了 0.1km"区分开（后者是 l1，明显有色） */
  background: color-mix(in srgb, var(--md-sys-color-on-surface) 5%, transparent);
}
.hm .c.l1 { background: color-mix(in srgb, var(--md-sys-color-primary) 32%, transparent); }
.hm .c.l2 { background: color-mix(in srgb, var(--md-sys-color-primary) 52%, transparent); }
.hm .c.l3 { background: color-mix(in srgb, var(--md-sys-color-primary) 74%, transparent); }
.hm .c.l4 { background: var(--md-sys-color-primary); }

.hm-months {
  position: relative; height: 12px;
  margin-bottom: 4px;
  font-size: 9px; color: var(--md-sys-color-on-surface-variant);
}
.hm-months span { position: absolute; top: 0; white-space: nowrap; }
.hm-grid .c { aspect-ratio: 1; }

/* 分格点阵（一格里一天/一小时）：格子固定大小、居中，圆角给足才像"点"而不是小方块 */
.hm-row { --hm-cell: 20px; }
.hm-line { display: grid; gap: 3px; justify-content: center; }
.hm-line .c { border-radius: 35%; }
.hm-legend {
  display: flex; align-items: center; justify-content: flex-end; gap: 3px;
  margin-top: 6px;
  font-size: 10px; color: var(--md-sys-color-on-surface-variant);
}
.hm-legend .c { width: 9px; height: 9px; border-radius: 2px; }
.hm-legend span { margin: 0 2px; }

.sheet-item {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 0;
  cursor: pointer;
}
.sheet-item .ico { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border-radius: var(--shape-full); background: var(--bg-inset); color: var(--md-sys-color-on-surface-variant); }
.sheet-item .t { font-size: 14px; font-weight: 500; }
.sheet-item .s { font-size: 11px; color: var(--md-sys-color-on-surface-variant); }
.sheet-item .tail { margin-left: auto; color: var(--md-sys-color-on-surface-variant); display: flex; align-items: center; gap: 8px; font-size: 12px; }
.sheet-item.sel { color: var(--md-sys-color-primary); }
.sheet-item.sel .t { font-weight: 600; }

/* 开关 */
/* 开关：关态是"浅色轨道 + 深色圆钮"，靠**圆钮本身**表达状态，不给轨道描 1px 边 */
.switch { position: relative; width: 48px; height: 30px; flex: none; border-radius: 99px; background: var(--bg-inset); transition: background var(--dur-short) var(--ease-standard); }
/* 滑块两边留白要跟上下留白对称：关=20px 滑块(上下各 5px)所以 left 5；开=24px 滑块(上下各 3px)所以 left 21。
   原来开态写 left:24 + 宽 24 = 48，正好等于轨道宽度，白滑块右边缘压在轨道边上（看着像被裁了一块）。 */
.switch::after { content: ""; position: absolute; left: 5px; top: 50%; width: 20px; height: 20px; transform: translateY(-50%); border-radius: 99px; background: var(--md-sys-color-outline); transition: all var(--dur-med) var(--ease-decel); }
.switch.on { background: var(--md-sys-color-primary); }
.switch.on::after { left: 21px; width: 24px; height: 24px; background: var(--md-sys-color-on-primary); }
.switch.disabled { opacity: .4; }
/* 点得动的开关给个手型；不可写的（.ro）保持默认光标 */
.switch[data-act="toggle"] { cursor: pointer; }
.switch.ro { cursor: default; }
.switch.busy { opacity: .5; pointer-events: none; }

/* 代码块 / 提示 */
.code {
  margin: 8px 0 0;
  padding: 12px;
  border-radius: var(--shape-m);
  background: var(--bg-inset);
  color: var(--md-sys-color-on-surface);
  font-family: ui-monospace, Consolas, monospace;
  font-size: 11.5px;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-all;
  max-height: 240px;
  overflow: auto;
}

/* 输入：**填充式字段**（M3 filled text field），不画描边——白底输入框在浅色卡上会看不见，

input[type="checkbox"] {
