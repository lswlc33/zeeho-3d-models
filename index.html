  // ---------------- 事件 ----------------
  function bind() {
    phone().addEventListener('click', async (e) => {
      const t = e.target.closest('[data-act]');
      if (!t) return;
      const act = t.dataset.act;
      switch (act) {
        case 'tab':
          S.tab = t.dataset.tab;
          savePrefs();
          render();
          load();
          break;
        case 'refresh':
          await load();
          break;
        case 'theme': {
          // 三态循环：跟随系统 → 固定为"当前的反面" → 回到跟随系统
          const cur = resolvedTheme();
          S.theme = S.theme === 'system' ? (cur === 'dark' ? 'light' : 'dark') : 'system';
          savePrefs();
          render({ keepScroll: true });
          U.toast(phone(), S.theme === 'system' ? '主题跟随系统' : `主题固定为${S.theme === 'dark' ? '深色' : '浅色'}`);
          break;
        }
        case 'debug':
          await refreshServer();
          debugSheet();
          break;
        case 'vehicles':
          vehicleSheet();
          break;
        case 'pickvin':
          S.vin = t.dataset.vin;
          savePrefs();
          U.closeSheet();
          load();
          break;
        case 'action':
          actionSheet(t.dataset.id);
          break;
        case 'setting':
          settingSheet(t.dataset.code);
          break;
        case 'toggle':
          e.stopPropagation();
          toggleSheet(t.dataset.code);
          break;
        case 'dowrite':
          doWrite(t.dataset.code);
          break;
        case 'closeSheet':
          U.closeSheet();
          break;
        case 'reload':
          // 「配置成功，请刷新」里那个按钮：此时地址已经抹掉参数，刷新即回到无参数网址
          location.reload();
          break;
        case 'reveal':
          S.locShown = !S.locShown;
          applyLocMask();                                        // 弹层里的地图/地址就地更新
          if (S.tab === 'home') render({ keepScroll: true });    // 首页的位置卡要整块重画（显示/隐藏地图）
          break;
        case 'bigmap':
          openBigMap();
          break;
        case 'mapmode':
          openBigMap(t.dataset.v || 'car');
          break;
        case 'group': {
          const id = t.dataset.id;
          if (!id) break;
          if (S.openGroups[id]) delete S.openGroups[id];
          else S.openGroups[id] = true;
          savePrefs();
          render({ keepScroll: true });
          break;
        }
        case 'groupsall': {
          const gs = S.data.settings?.groups || [];
          const anyOpen = gs.some((g) => S.openGroups[g.id]);
          S.openGroups = {};
          if (!anyOpen) for (const g of gs) S.openGroups[g.id] = true;
          savePrefs();
          render({ keepScroll: true });
          break;
        }
        case 'ride':
          // 直接开：U.sheet 会就地换内容。以前是"先 closeSheet、等 220ms 再开"，
          // 而 closeSheet 的延迟清空是 260ms——两者抢起来会把刚开的弹层内容清掉（卡在底下出不来）。
          openRide(S.month);
          break;
        case 'rideview': {
          const v = t.dataset.v || 'month';
          if (v === RIDE.view) break;
          RIDE.view = v;
          RIDE.day = null;
          RIDE.trip = null;
          renderRideSheet();
          if (v === 'year') ensureYear().then(() => { if (RIDE.view === 'year' && !RIDE.day && !RIDE.trip) renderRideSheet(); });
          break;
        }
        case 'rideback':
          RIDE.day = null;
          RIDE.trip = null;
          renderRideSheet();
          break;
        case 'month': {
          const v = t.dataset.v;
          if (!v || v > S.month) break;
          RIDE.month = v;
          RIDE.day = null;
          RIDE.trip = null;
          renderRideSheet();
          // 翻回当月也强制重取一次（历史月份不变，没必要）
          ensureMonth(v, { force: v === S.month }).then(() => { if (!RIDE.day) renderRideSheet(); });
          break;
        }
        case 'day':
          RIDE.day = t.dataset.date || '';
          RIDE.trip = null;
          // 单日也重取一次：点的大概率是"今天"，行程段随时会多出来（旧的先摆着，见 renderRideDay）
          RIDE.refreshDay = RIDE.day;
          renderRideDay();
          break;
        case 'riderefresh': {
          // 手动刷新当前视图（点开时已经自动刷过一遍，这是给"停在弹层里等数据"用的）
          if (RIDE.day) { RIDE.refreshDay = RIDE.day; renderRideSheet(); }
          else if (RIDE.view === 'year') ensureYear({ force: true }).then(() => { if (!RIDE.day) renderRideSheet(); });
          else ensureMonth(RIDE.month, { force: true }).then(() => { if (!RIDE.day) renderRideSheet(); });
          U.toast(phone(), '正在刷新…', 1200);
          break;
        }
        case 'trip':
          RIDE.trip = t.dataset.id || '';
          renderRideTrip();
          break;
        case 'tripback':
          RIDE.trip = null;
          renderRideDay();
          break;
        case 'navigate': {
          const loc = S.data.home?.loc;
          if (!loc?.has) break;
          // 唤起高德 App（不是跳网页），坐标本来就是 GCJ-02，直接给
          openInAmap(loc.lng, loc.lat, S.data.home?.name || '车辆位置');
          break;
        }
        case 'rawlist':
          rawSheet();
          break;
        case 'raw':
          rawDetail(t.dataset.id);
          break;
        case 'opt':
          if (t.dataset.k === 'source') {
            await API.setSource(t.dataset.v);
            S.source = t.dataset.v;
            U.closeSheet();
            setTimeout(load, 240);
          }
          break;
        case 'accent':
          S.accent = t.dataset.v;
          savePrefs();
          U.closeSheet();
          setTimeout(() => render({ keepScroll: true }), 240);
          break;
        case 'tile':
          S.tile = t.dataset.v;
          savePrefs();
          U.closeSheet();
          setTimeout(() => render({ keepScroll: true }), 240);
          break;
        case 'poll':
          S.pollMs = Number(t.dataset.v);
          savePrefs();
          startPoll();
          U.closeSheet();
          setTimeout(() => U.toast(phone(), S.pollMs ? `每 ${S.pollMs / 1000} 秒刷新` : '已关闭自动刷新'), 260);
          break;
        case 'savetoken': {
          const v = ($('tokenInput')?.value || '').trim();
          const uidVal = ($('uidInput')?.value || '').trim();
          const curToken = API.token || API.loadToken() || '';
          // 输入框是预填的，所以"没动过"才是常态：只有真改了才走下面的换账号流程。
          // 清空同样算改动——那表示"不再存这份 token"。
          const tokenChanged = v !== curToken;
          // "把账号 id 清空"也是一种有效的修改（= 不显示昵称头像），所以不能只看 uidVal 非空
          const uidChanged = uidVal !== (S.profileUid || '');

          // token 没动（填的就是本机存的那份，或服务端存着而这里留空）→ 只当改账号 id
          if (!tokenChanged) {
            if (!uidChanged) { U.closeSheet(); U.toast(phone(), '没有改动'); break; }
            S.profileUid = uidVal; savePrefs();
            U.closeSheet();
            await loadAccount();
            render({ keepScroll: true });
            U.toast(phone(), S.data.user?.ok ? '昵称已更新' : (uidVal ? '这个 id 没查到档案' : '已隐藏昵称和头像'));
            break;
          }
          // token 改了：等于换账号，车辆列表 / VIN / 缓存全部作废重来。
          // （不清的话会拿上一次（可能是演示数据里那份打码 VIN）去查真车，一路返回空、页面看着就是错的）
          S.profileUid = uidVal;
          API.saveToken(v);              // 空串 = 把本机那份删掉
          S.vehicles = []; S.vin = ''; S.data = {};
          // 有本机服务就顺手写服务端文件；纯静态页只存浏览器里。
          // 清空时不写服务端：那是本机存着的凭据，只能手删文件（服务端也会拒空值，两道都拦）
          const r = API.server && v
            ? await fetch('/api/token', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: v }) }).then((x) => x.json()).catch(() => null)
            : null;
          if (API.server && v && !r?.ok) { U.toast(phone(), '保存失败：' + (r?.err || '本机服务没响应')); break; }
          await refreshServer();
          // 清空又没有本机服务 → 回演示数据；别留在"需要 token"的直连模式里干瞪眼。
          // （本机服务里还有 token 的话照旧用它，只是浏览器里这份没了）
          await API.setSource(r?.ok ? 'live' : (v ? 'direct' : (API.server?.hasToken ? 'live' : 'demo')));
          U.closeSheet();
          if (!v) {
            U.toast(phone(), API.server?.hasToken ? '已清除浏览器里存的 token（本机服务里的照旧）' : '已清除 token，回到演示数据');
            render();
            break;
          }
          U.toast(phone(), '已保存，正在拉取车辆…');
          await load();
          await loadAccount();          // 账号信息不在首页那批请求里，单独拉一次
          render({ keepScroll: true });
          U.toast(phone(), '数据已更新');
          break;
        }
        case 'eye': {
          // 眼睛按钮：把对应的输入框在明文/遮起来之间切一下（按钮自己也换个图标和提示）
          const inp = $(t.dataset.target);
          if (!inp) break;
          const show = inp.type === 'password';
          inp.type = show ? 'text' : 'password';
          t.innerHTML = U.icon(show ? 'eyeOff' : 'eye', 20);
          t.title = show ? '隐藏' : '显示';
          break;
        }
      }
    });
  }

  // ---------------- 轮询 ----------------
  let timer = null;
  function startPoll() {
    clearInterval(timer);
    if (S.pollMs > 0) timer = setInterval(() => { if (!document.hidden) load({ silent: true }); }, S.pollMs);
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load({ silent: true }); });

  // ---------------- PWA ----------------
  /** 注册 service worker：为了"装到桌面"和"断网也能打开"。装不上不影响页面使用，所以失败静默。 */
  function registerSw() {
    if (!('serviceWorker' in navigator)) return;
    if (!/^https?:$/.test(location.protocol)) return;   // file:// 下没有 SW，别去注册（会报错）
    navigator.serviceWorker
      .register('sw.js', { scope: './' })
      .then(() => navigator.serviceWorker.ready)
      .then((reg) => {
        // 预热：把页面自己的同源子资源交给 SW 补进缓存。
        // 单文件产物（发到 GitHub Pages 的那份）没有子资源，这里就是空数组；
        // 开发版是分开的 js/css，不补的话"第一次断网"会白屏——SW 接管发生在这些请求之后。
        const urls = [...new Set(performance.getEntriesByType('resource').map((r) => r.name))]
          .filter((u) => u.startsWith(location.origin) && !u.includes('/api/'));
        reg.active?.postMessage({ type: 'warm', urls });
      })
      .catch(() => { /* 忽略 */ });
  }

  // ---------------- URL 参数下发（模块 App 的「全新仪表」按钮） ----------------
  //
  // 模块 App 点「全新仪表」会用 ?token=xxx&uid=yyy 打开本页（地址见 Prefs.WEB_DASHBOARD_URL）。
  // 收到参数就填进设置、拿 token 真打一条接口验证，然后弹窗提示刷新，并把参数从地址栏抹掉
  // —— 用户点刷新回到的就是无参数网址。
  //
  // 账号 id 允许 uid / userId / user_id 三种写法：调用方写错一个不至于失效。
  function readUrlCreds() {
    let q;
    try {
      q = new URLSearchParams(location.search || '');
    } catch {
      return null;    // 老引擎没有 URLSearchParams：当没带参数
    }
    const token = (q.get('token') || '').trim().replace(/^bearer\s+/i, '');
    const uid = (q.get('uid') || q.get('userId') || q.get('user_id') || '').trim();
    if (!token && !uid) return null;
    return { token, uid };
  }

  /** 去掉 query 的本页地址（刷新后回到无参数网址）。 */
  const cleanHref = () => location.origin + location.pathname;

  /**
   * 应用 URL 带来的凭据：验证 → 弹窗 → 清参数。返回是否验证通过。
   *
   * 验证就是拿这个 token 真打一条带登录态的接口（vehicle_list）：只有 code=10000 才算通，
   * 其余（401 / 网关维护页 / 超时）都把原始信息显示出来，别让人对着空页面猜。
   */
  async function applyUrlCreds(creds) {
    const r = creds.token ? await API.call('vehicle_list') : { ok: true };
    // 无论成败都先把参数从地址里抹掉：这样"刷新"本身就是回到无参数网址，
    // 不用依赖用户点哪个按钮。
    try { history.replaceState(null, '', cleanHref()); } catch { /* 老引擎忽略 */ }
    if (r.ok) {
      U.sheet(phone(), {
        title: '配置成功，请刷新',
        sub: creds.token
          ? `已写入 token${creds.uid ? ' 与账号 ID' : ''}，刷新后即可看到真车数据`
          : '已写入账号 ID，刷新后生效',
        body: `<div class="field mt12"><button class="btn block" data-act="reload">刷新</button></div>
               <div style="height:8px"></div>`,
      });
      return true;
    }
    U.sheet(phone(), {
      title: '配置失败',
      sub: [r.http ? `HTTP ${r.http}` : '', r.code ? `code ${r.code}` : ''].filter(Boolean).join(' · '),
      body: `<div class="field">${esc(r.message || r.err || 'token 可能已过期，重新登录极核后再点一次「全新仪表」')}</div>
             <div class="field mt12"><button class="btn text block" data-act="closeSheet">知道了</button></div>
             <div style="height:8px"></div>`,
    });
    return false;
  }

  // ---------------- 启动 ----------------
  async function init() {
    loadPrefs();
    // 模块 App 带参数打开时先落盘：API.init() 正是靠 localStorage 里这份 token 决定走直连的
    const creds = readUrlCreds();
    if (creds?.token) API.saveToken(creds.token);
    if (creds?.uid) { S.profileUid = creds.uid; savePrefs(); }
    applyTheme();
    registerSw();
    const d = new Date();
    S.month = `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}`;
    await refreshServer();
    await API.init();
    S.source = API.source;
    render();
    const list = await API.call('vehicle_list');
    S.vehicles = M.vehicles(list);
    if (!S.vehicles.some((v) => v.vin === S.vin)) S.vin = S.vehicles[0]?.vin || '';
    // 账号档案 + 积分/签到：账号档案要用户手填的 id，所以单独走一次
    await loadAccount();
    const s = await API.all(SET_IDS, { vin: S.vin, uid: S.profileUid || '', month: S.month });
    if (s.vehicle_set_items) S.data.caps = s.vehicle_set_items;
    if (s.vehicle_set_info) S.data.info = s.vehicle_set_info;
    bind();     // 事件先挂上：下面的"配置成功"弹窗里那个刷新按钮要靠它才点得动
    if (creds) {
      // 带参数进来只做"配置"这一件事：验证通了就停在提示刷新这一步，
      // 不接着拉数据（半截数据看着像坏的，而且马上要刷新一次，白拉）。
      const ok = await applyUrlCreds(creds);
      if (ok) return;
    }
    await load();
    startPoll();
  }

  return { init, load, render, state: S, ACTIONS };
})();

document.addEventListener('DOMContentLoaded', () => window.APP.init());

</script>
</body>
</html>
